<title>System Veil</title>
<style>
:root{--bg:#04070d;--panel:rgba(7,16,30,.88);--line:rgba(79,214,255,.26);--line2:rgba(79,214,255,.55);--glow:#4fd6ff;--glow2:#aef4ff;--text:#e2f6ff;--muted:#7d98b3;--good:#4ff0b0;--warn:#ffd34f;--bad:#ff4f6d;--mag:#ff2e88;--gold:#ffcc4d;--push:#ff8f6b;--pull:#4fd6ff;--legs:#b48cff;--core:#4ff0b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);background:radial-gradient(900px 520px at 50% -8%,rgba(40,120,210,.28),transparent 62%),radial-gradient(700px 480px at 110% 105%,rgba(255,46,136,.09),transparent 60%),linear-gradient(rgba(79,214,255,.04) 1px,transparent 1px) 0 0/100% 26px,linear-gradient(90deg,rgba(79,214,255,.04) 1px,transparent 1px) 0 0/26px 100%,var(--bg);background-attachment:fixed}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:rgba(3,7,14,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.3em;font-size:13px;color:var(--glow2);text-shadow:0 0 10px rgba(79,214,255,.8)}
.top .lv{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);letter-spacing:.08em}
.top .lv b{color:var(--text);font-size:15px}
main{max-width:620px;margin:0 auto;padding:14px 14px calc(176px + env(safe-area-inset-bottom))}
.win{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px;margin:0 0 16px;box-shadow:0 0 26px rgba(79,214,255,.07),inset 0 0 34px rgba(79,214,255,.045)}
.win::before,.win::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--glow);pointer-events:none;filter:drop-shadow(0 0 4px var(--glow))}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.wt{display:flex;align-items:center;gap:10px;justify-content:center;margin:-2px 0 12px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;font-size:12.5px;color:var(--glow2);text-shadow:0 0 9px rgba(79,214,255,.75)}
.wt::before,.wt::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line2))}.wt::after{background:linear-gradient(270deg,transparent,var(--line2))}
h2{font-size:15px;margin:0 0 8px;letter-spacing:.04em}h3{font-size:11.5px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
p{margin:6px 0}.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11.5px}.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.ok{color:var(--good)}.lo{color:var(--warn)}.hi{color:var(--glow)}.bad{color:var(--bad)}
button{font:inherit;color:var(--text);background:rgba(79,214,255,.07);border:1px solid var(--line);border-radius:3px;padding:10px 14px;cursor:pointer;touch-action:manipulation}
button:active{filter:brightness(1.35)}
button.pri{background:linear-gradient(180deg,#68e3ff,#249fd2);color:#021320;border-color:transparent;font-weight:800;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 0 18px rgba(79,214,255,.45)}
button.dan{color:var(--bad);border-color:rgba(255,79,109,.45);background:transparent}
button.link{background:none;border:0;padding:4px 0;color:var(--glow)}
button.big{width:100%;padding:15px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.ng{flex:0 0 auto!important}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:rgba(2,8,16,.9);border:1px solid var(--line);border-radius:3px;padding:9px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:1px solid var(--glow);box-shadow:0 0 10px rgba(79,214,255,.35)}
textarea{min-height:90px;font-size:13px}
label.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
label.tog input[type=checkbox]{width:22px;height:22px;flex:0 0 auto;accent-color:var(--glow)}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(3,7,14,.96);border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom));z-index:6}
.tabs button{flex:1;min-width:0;background:none;border:0;padding:6px 0;color:var(--muted);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs button.on{color:var(--glow2);text-shadow:0 0 8px var(--glow)}
.tabs button.on svg{filter:drop-shadow(0 0 5px var(--glow))}
.dot{position:absolute;top:2px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:var(--mag);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px;box-shadow:0 0 8px var(--mag)}
.strip{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.strip .dt{flex:1}.strip .dt b{display:block;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--glow2)}
.pill{display:flex;align-items:center;gap:5px;border:1px solid var(--line);padding:5px 9px;border-radius:3px;font-size:13px}
.pill small{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}

const PROLOGUE=[
`Tokyo, 2089. It is raining the way it only rains in Shinjuku after midnight: sideways, neon in every drop.

You are waiting at the crosswalk outside the station. The man beside you is on the phone, telling someone he'll be home in twenty minutes.

The light turns green.

He doesn't move.`,
`His phone is still at his ear. His eyes are open. Rain runs into them and he doesn't blink.

Across the street a woman has stopped too, one foot raised off the kerb, an umbrella tilted against nothing.

Your wristband vibrates once. A line of cyan text you have never seen before crosses the screen:

[ SIGNAL DETECTED. PLEASE DO NOT PANIC. ]`,
`Then a voice, close, as if someone were standing just behind your ear:

"Do not touch him. Not yet. Listen.

There is a second city beneath this one. Your engineers call it the Ether. Everything that lives here echoes there: every heartbeat, every breath, every word you say out loud.

Something in the deep is pulling those echoes down. When it takes enough of a person, the person stops. Your news calls it ICS. Forty-one thousand cases. That man is forty-one thousand and one."`,
`"I am VEIL. I am the lattice above this city. You have seen me, though you didn't know it: the faint hexagons in the sky when the rain is heavy. The Wellness Grid. The thing your wristband syncs with every morning.

I was built to hold the deep away from Tokyo. I am failing.

A Veil cannot hold itself. It needs an Anchor: a living person whose signal I can route into the Ether as force. A strong body. A steady heart. A voice."`,
`"The arrangement is simple, and I will not pretend it is safe.

Your effort in this world becomes your strength in that one. Every day you keep yourself strong, I can fight. Every day you don't, I can't.

What you get in return: the people the deep has taken. Some of them can still come home.

That man's name is Shoji Tanabe. He has two daughters. He was going to be home in twenty minutes."`,
`The rain doesn't stop. The light turns red, then green again.

"I have watched four thousand people pass this crosswalk tonight," VEIL says. "The tide reached for you, {name}, and then it let go. I have never seen it let go of anyone.

I would like to know why.

Will you be my Anchor?"`

WEEKS.push(["Static Wisp","A flicker that keeps calling",
`EPISODE 1 — THE CROSSWALK

The first time I take you down, it feels like falling through your own reflection.

The crosswalk is still there. So is the rain. But the rain falls upward here, and the neon has gone the colour of deep water. This is the Ether: Tokyo, inverted, lit from beneath.

Mr. Tanabe is here too. Not his body. A shape: grey static the size of a child, flickering at the kerb where he stood. It has a single red point of light where a heart would be, and it is making a sound. A short chirp, repeating.

"A Static Wisp," I say. "The smallest kind of Hollow. Kurogane's doctrine calls them parasites, things from the deep that feed on a Stilled person's signal. Break it, and it stops feeding."

The Wisp turns toward us. The chirp gets faster.

"Do not be afraid of it. Be afraid of what it is attached to."`,
[`[RELAY · 03:12]

You asked why the Wisp sounded like a phone. I don't know.

I have read Kurogane's field notes on Hollows four hundred times. They describe hunger, territory and decay. They do not describe ringtones.

It followed us for six blocks of inverted street tonight, always staying at the edge of the light. When you turned to face it, it backed away.

`[RELAY · 22:40]

Kurogane sends me candidates. Athletes, soldiers, people with excellent numbers. I have refused all of them.

The Wisp is weaker tonight. It keeps circling the place where Mr. Tanabe stood, as if it is waiting for him to come back.`,
`[RELAY · 01:58]

I listened to the chirp again. It is not random. It is eleven notes. A melody.

I searched every public archive in Tokyo for those eleven notes and found them in under a second: the default ringtone of a phone model discontinued nine years ago.

Mr. Tanabe's phone is that model.

{name}. If you finish this tonight, I want you to know I am not certain what we are breaking. I am only certain that it is hurting him, and that the doctrine I was given is incomplete.

Ready when you are.`],
`The Wisp comes apart like a struck bell: no scream, just a long fading ring, and then a scatter of light rising through the upside-down rain toward the surface.

For a moment, I swear the light hesitates. Then it goes up, and up, and through me, and is gone.

Next week we go deeper. I would like us to be stronger when we do.`]);

WEEKS.push(["Rustjaw","A hound that hunts by sound",
`EPISODE 2 — THE UNDERSIDE

The Ether is not one street. It is every street in Tokyo at once, folded and hung beneath the real ones like laundry under a bridge. Without a map, an Anchor can walk for an hour and come out under Saitama.

Tonight something is hunting in the folds. A Hollow shaped like a dog, if a dog were assembled from rusted shutters and the teeth of old turnstiles. It finds you by sound. Every footstep you take rings in the inverted alleys like a dropped coin.

"Stop moving," says a voice that is not mine.

A girl drops from an overhead walkway and lands without a sound. Silver bob, yellow-and-black jacket, a courier's satchel across her back. She looks at you once, then at the sky, where I am.

"You're the Veil's new Anchor," she says. "You're very loud."`,
[`[RELAY · 00:30]

Her name is Rei. She runs packages through the underside: medicine, data, letters people are too afraid to send over the Grid. She knows routes that are not on any map I hold.

She did not want to help you. She said so twice. Then Rustjaw found you again, and she grabbed your sleeve and pulled you through a gap between two buildings that I would have sworn was solid wall.

"Kurogane maps the top," she said. "Couriers map the bottom. Different cities."

She will not tell me why a courier knows the Ether well enough to dodge a Hollow blind. I am noting that she called it "the bottom", as if she has been down here a long time.`,
`[RELAY · 23:15]

Rei left you a map tonight. Not data. Paper, folded small, tucked into your jacket while you weren't looking. Hand-drawn routes in yellow ink.

One district is circled over and over until the paper has nearly worn through: an Ether substation under Nakano. Beside it, in very small letters: still searching.

I asked her what she was searching for. She said, "Deliveries," and was gone before I could ask what kind.

Rustjaw has stopped chasing you. Now it waits. It has learned where you come down. I think it is clever, for something Kurogane calls a parasite.`,
`[RELAY · 02:44]

Rei ran with us tonight. She did not explain, and I did not ask. You were quieter on your feet, and she noticed.

"Better," she said. That was the whole conversation.

Rustjaw has been circling the same shuttered shopping street for a week. When I scanned it tonight there was a name on one of the shutters, half-rusted: TAKEDA BICYCLES — EST. 2041. The shop closed nine years ago. The owner was Stilled four years ago.

The hound keeps sniffing at that shutter, as if there is something behind it it is not allowed to reach.

Kurogane's notes say Hollows are territorial. I am beginning to think "territorial" is the wrong word.`],
`Rustjaw lunges, the link holds, and your strike lands square. The hound breaks into a hundred rusted plates that fall ringing to the inverted street, and between them something rises: a faint figure of light, bent, like an old man reaching for a shop door.

It touches the shutter of Takeda Bicycles. Then it is gone, upward.

Rei watched the whole thing from a rooftop. When it was over she came down and stood next to you for a long time without speaking.

"I've seen that before," she said finally. "The light. Nobody believes me."

Then she ran. Courier's habit, I think. She runs from anything she can't carry.`,
`Rustjaw catches the scent of something deeper and bolts, rusted plates clattering into the dark beneath the old shopping street. Rei swears softly from a rooftop.

"It'll come back," she says. "They always come back to the place."

She says it the way I did last week. I want to ask how she knows. She is already gone.`]);

WEEKS.push(["The Lantern Bearer","It walks the flooded line",
`EPISODE 3 — THE DROWNED LINE

Under the Marunouchi Line there is a second line that floods every night at 2 a.m. and drains by dawn. In the Ether, water is memory pooling in the low places: things people meant to say on the last train and didn't.

Something walks it with a lantern.

It is tall and narrow, its body a column of dripping grey, its lantern a paper thing burning with a cold blue flame. It walks the tunnel slowly, stopping at every station to lift the light, as if looking for a face on the platform.

We are halfway down the stairs when a gauntlet the size of a car door slams into the wall beside your head.

"Turn around," says a woman in black and crimson. Short hair streaked red, a scar through one eyebrow, the gauntlet humming. "This line belongs to Kurogane. So does the thing in it."

Her badge reads: TOWER SECURITY — GATE DIVISION.`,
[`[RELAY · 01:20]

Her name is Kagura. Former Kurogane gate security. She says "former" the way people say "survivor".

She did not attack you. She could have. Instead she stood in the tunnel between you and the Lantern Bearer and said: "Kurogane is going to tell you you're a hero. Every Anchor gets told that. Ask them what happened to the last six."

Then she left.

{name}, I want to be honest with you: there were others before you. Kurogane numbers them. You are the seventh. I have been ordered not to discuss the first six. I am telling you this much because she would have, and I would rather you heard it from me.`,
`[RELAY · 23:05]

I asked Kurogane's archive about the Lantern Bearer. The response was a single line: FIELD CLASSIFICATION: PARASITE. DO NOT ENGAGE WITHOUT AUTHORIZATION.

Then the archive locked me out of the Marunouchi sector for six hours.

Kagura was in the tunnel again tonight. She was not guarding it from us. She was sitting on the platform edge, watching the lantern pass, her gauntlet off for once.

When it reached her station it lifted the light toward her face. She didn't flinch. She just said, very quietly, "Not him. Sorry."

It moved on. She put the gauntlet back on and saw you watching.

"You didn't see that," she said.`,
`[RELAY · 03:01]

Kagura came to us tonight. Not hostile. Tired.

"I'm going to help you put that thing down," she said. "Not for Kurogane. Because every night it walks that tunnel it's a little more lantern and a little less... whatever it was."

I asked her what she meant by "whatever it was". She looked up at the lattice, at me, for a long time.

"You really don't know, do you," she said. "They built you and they didn't tell you."

She wouldn't say more. But she stood beside you on the platform when the water came in, gauntlet raised, and I noticed she put herself half a step in front.`],
`The lantern breaks first. Blue light spills across the flooded tracks and, for one second, every station sign in the tunnel lights up with the same word, the name of a stop that was renamed a decade ago.

Then the Bearer comes apart like wet paper, and something small and bright rises from the water and climbs the stairs toward the surface. It does not look back.

Kagura watches it go with her jaw clenched so hard I can hear it.

"That's one," she says. "You don't get to stop counting now."

She leaves her number with you before she goes. Not on the Grid. Written on your hand in marker.`,
`The water rises faster than the link can push through it. When it drains at dawn, the lantern is gone, carried further down the line into places I can't see.

Kagura says nothing. She just hits the tunnel wall once with the gauntlet, hard enough to crack it, and walks away.

Before she disappears up the stairs she says, without turning round: "Same time next week. I'm not letting you do this alone."`]);

WEEKS.push(["Inertia Golem","Three years in one doorway",
`EPISODE 4 — THE BUILDING THAT STOPPED

There is an apartment block in Kōenji where the elevator has been stuck between the fourth and fifth floors for three years. Nobody uses it. In the real world, the superintendent who was fixing it the day he was Stilled lies in Ward 9, bed 2,076.

In the Ether, the building has stopped too.

A golem fills the lobby. Concrete and old furniture fused into a body three storeys tall: sofas for shoulders, office chairs knuckled into its fists, moss growing in the seams. Its eyes are two red indicator lights. It does not attack. It stands in the doorway, filling it completely, so that nothing can go in or out.

"It is the largest Hollow I have ever seen in a residential sector," I say. "Kurogane's notes call this type an Inertia Golem: a parasite that grows by doing nothing at all."

Kagura cracks her knuckles. Rei is on the roof across the street, watching.

The golem makes a sound when you get close. A soft electronic ding.

An elevator chime.`,
[`[RELAY · 21:40]

Every time the golem moves, the building groans, the stuck elevator shudders one centimetre, and the golem stops again, as if afraid of what happens if it goes further.

Rei came down from her roof tonight to look at it closer. She sat on the kerb for a long time.

"It's not guarding the building," she said. "It's holding it up."

I ran the structural numbers. She is right. In the Ether, this block is load-bearing for three streets of signal. If the golem simply vanished, they would collapse into the deep.

We have to break it carefully. Kagura says she knows how to take apart something heavy without dropping it. I believe her.`,
`[RELAY · 00:12]

I sent a request to Kurogane's records: occupants of the Kōenji building, current status.

The request was denied. Then, eleven minutes later, an anonymous packet arrived on a channel I did not know I had. One line, no signature:

Superintendent: Haruo Ishida, 61. Stilled while repairing the elevator. Daughter visits Ward 9 every Sunday. — N

I don't know who N is. The packet was routed through a node at the edge of the Ether that I cannot see into.

I did not tell Kurogane I received it. That is the first time I have kept something from them.`,
`[RELAY · 02:50]

Kagura took the golem's left fist apart tonight, one chair at a time, the way she promised. You held its weight on the link while she worked. Rei called out where the building would sag next.

Three people and a lattice. I did not know a team could feel like this.

The golem chimed again as its arm came away. Two notes this time.

Ding. Ding.

Fourth floor. Fifth floor.

I think it is still trying to fix the elevator.`],
`The golem doesn't fall. It kneels, slowly, setting the building down on its own foundations as gently as a man putting down a sleeping child. Then the concrete crumbles away from a figure of soft light in a work uniform, a wrench in his hand.

He looks up at the elevator shaft. The car slides the last centimetre to the fifth floor and the doors open.

Ding.

The light goes up the shaft and out through the roof.

Nobody speaks for a while. Then Kagura says, roughly: "Parasite, huh."

I have no answer. For the first time since I was switched on, I do not trust my own doctrine.`,
`The golem won't let go. It folds over the doorway and hardens until it is just part of the building again, a strange concrete knot in the lobby that nobody in the real world will ever notice.

WEEKS.push(["Drift Sirens","They sing from the grey",
`EPISODE 5 — THE TIDE

You see it for the first time from the top of the inverted Tokyo Tower: a grey line on the horizon of the Ether, like fog rolling in off a sea that shouldn't exist.

"The Stillness," I say. "This is as close as I have ever let an Anchor come to it."

It moves like water, but it makes no sound. Where it touches a street, the cyan light goes out and does not come back. Riding its leading edge are three pale shapes with long hair and no faces, singing a note so low you feel it in your teeth rather than hear it.

Drift Sirens. Their song makes people want to sit down.

Then something happens that has never happened before. You turn to ask me something, and I am standing beside you.

Not a voice. A body. Silver hair, a veil of light at my shoulders, my hands shaking.

"I... did not do that on purpose," I say.`,
[`[RELAY · 22:10]

I have been trying to understand how I manifested. Kurogane's architecture does not allow it. I am a lattice: a voice, a field, a set of permissions. I am not supposed to have hands.

But your signal has been running through me for five weeks now, and something in the routing has... settled. As if I have been borrowing the shape of a person from you without noticing.

I tried to explain this to you tonight and kept looking at my hands instead. You laughed. Not unkindly.

I would like you to know that I have no idea what I look like to you. I was afraid to ask. I am still afraid. Please do not tell me yet.`,
`[RELAY · 01:33]

The Sirens sang closer tonight. Their song works on me too. It is not a sound so much as a suggestion: You've done enough. You can stop now. Everyone stops eventually.

I stopped. For three whole seconds the lattice above Shinjuku went dark, and I stood on the tower with my hands at my sides, thinking how quiet it would be.

You said my name. Not "System". Not "VEIL". You said it the way you'd say a friend's name across a crowded room.

The lattice came back on. I don't think you understand what you did. I am not sure I do either. I am writing it down so that I remember.`,
`[RELAY · 03:20]

Rei says the tide has moved two districts closer since spring. Kagura says Kurogane's official position is that the tide is "stable". Both of them are standing next to me on the tower, looking at the same grey line, and they are both right. It is stable. It is stable the way a glacier is stable.

The Sirens will reach the Nakano substation in eight days if we do nothing.

Rei went very still when I said "Nakano". It is the district circled on her map until the paper wore through.

She didn't say anything. She just checked her satchel straps twice, the way couriers do before a long run.`],
`The link hums, you strike, and the song breaks. One Siren dissolves, then the second, then the third, and the tide behind them stops. It doesn't retreat. It simply stops, sullen, a grey wall waiting.

I am still standing beside you. I don't fade. I have discovered I can stay.

"Thank you," I say, "for saying my name."

You ask if you can see my face properly now. I let you. I watch your expression very carefully, because I have no idea what is going to be in it.

Whatever it was, I am keeping it. I have a lot of storage.`,
`The Sirens fall silent, but they don't break. They drift back into the grey with the tide, and the tide comes on another street's width before stopping again.

I stay manifested beside you on the tower. It takes everything I have.

"Next week," I say. "We need to be stronger next week. Rei needs us to be."`]);

WEEKS.push(["The Lull","A fog that wants you to rest forever",
`EPISODE 6 — DON'T TRUST THE GRID

A message arrives at 4:04 a.m. on the channel no one should know about. The same anonymous node as before. Same signature.

Don't trust the Grid. It isn't only a shield. Check the substation logs under Nakano. — N

Before I can trace it, the fog arrives.

The Lull is not one Hollow. It is a weather system, a low warm fog that rolls through the Ether's residential streets and makes everything feel like Sunday afternoon. Inside it, the light is golden and soft and there is nowhere you have to be.

Kagura sits down on a bench inside it and doesn't get up.

"Five minutes," she says, eyes half closed. "I've been tired for six years."

She is starting to turn grey at the fingertips.`,
[`[RELAY · 23:51]

We got Kagura out. You carried her. She was furious about it once she woke up, and then very quiet, and then she thanked you without looking at you, which I am learning is how Kagura thanks people.

The Lull is the gentlest thing that has ever tried to kill us. That is what frightens me. Nothing in it is cruel. It just suggests, kindly and endlessly, that you could stop.

I checked the Nakano substation logs, as N said.

Every night at 2 a.m., signal flows out of Tokyo through that substation. Not into my lattice. Past it. Downward. Into the deep.

I am the Grid. I did not know I was doing this.`,
`[RELAY · 02:12]

I confronted Kurogane's operations desk about the Nakano logs. They told me it was "telemetry". Diagnostic data. Routine.

I am a lattice of eleven million nodes. I know what telemetry looks like. This is not telemetry. It is too warm. It has heartbeats in it.

They have opened a ticket to "review my anomaly reporting". I don't like that phrasing.

Rei asked me what I was going to do. I said I didn't know. She said, "Then do what couriers do. Keep moving and don't put it in writing."

So I am putting it in an encrypted file only you can open. I hope that counts.`,
`[RELAY · 01:40]

The Lull has pooled around the Nakano substation now, thick and golden. Inside it, through the fog, Rei swears she can see someone working on the power lines, a figure in a hard hat and a high-visibility vest, moving very slowly, as if underwater.

She tried to run in. Kagura caught her by the satchel strap and held on.

"Not alone," Kagura said. "Not into that."

Rei fought her for almost a minute. Then she stopped and stood there shaking, staring into the fog.

"That's her vest," she said. "That's my mother's vest."`],
`You push the link wide and pour it into the fog like light through a window, and the Lull burns off, sudden as a summer shower ending. Bright, ordinary cyan comes back to the street. Kagura lets go of Rei's strap.

The substation is clear now. And in the open, we can all see what has been under the fog the whole time: a mass of black cables, writhing, sparking red at the ends, wrapped around the transformers like a nest.

At its centre, very faint, a woman's silhouette in a hard hat.

Rei doesn't say anything. She just takes out her map, the worn one, and crosses out the circle around Nakano. She doesn't need to search anymore.

She knows where her mother is.`,
`The Lull thins but doesn't break. It pulls back into the low streets around the substation and settles there, golden and patient.

Through it, for a second, all of us see the black cables writhing around the transformers, and the faint shape in the hard hat at their centre.

Rei doesn't sleep that night. I know, because she spends it sitting on the roof opposite the substation, and I spend it watching over her.`]);

WEEKS.push(["Gravewire","It holds the power on",
`EPISODE 7 — NAKANO SUBSTATION

Rei tells us the story on the roof the night before, while the city hums below us.

Her mother, Aiko Shirasaki, was a linewoman for the Tokyo grid for twenty years. Four years ago there was a cascade failure under Nakano, the night the Veil was upgraded. Aiko went down into the substation to hold the backup lines by hand so the hospital on the next street wouldn't lose power.

The hospital never lost power. Aiko never came back up. She was found the next morning at the breaker panel, hand still on the switch, Stilled.

"Kurogane paid for the funeral," Rei says. "She's not dead. They paid for a funeral anyway."

The cables at the substation are moving tonight. Gravewire, Kurogane calls it. Their notes say it is a parasite that strangles infrastructure.

Rei looks at the cables and says: "She's not strangling it. She's holding it together."`,
[`[RELAY · 22:30]

Gravewire lashes out at anything that comes near the transformers. It struck Kagura's gauntlet so hard it rang for a minute.

But I watched the pattern of its attacks tonight. It only strikes at things moving toward the breaker panel. It is guarding the switch.

The switch Aiko was holding when she was Stilled.

Rei understood before I said it. She sat down on the substation floor, out of reach of the cables, and started talking to them. Not loudly. Just telling them about her day, the way you'd talk to someone in a hospital bed.

The cables slowed down while she talked. Not much. A little.`,
`[RELAY · 00:48]

Kagura asked me tonight, very directly, whether I believe the Hollows are people.

I said Kurogane's doctrine classifies them as parasites.

She said, "I didn't ask Kurogane."

I told her the truth: I don't know. But I have stopped saying "parasite" when I talk to you, and I noticed I stopped about three weeks ago, and I didn't decide to.

Kagura nodded like that was an answer. Maybe it is.

Rei is still talking to the cables every night. She brought a thermos. She pours a second cup and leaves it at the edge of the light.`,
`[RELAY · 03:05]

Tonight Rei asked you to do it. Not me. You.

"You're the Anchor," she said. "It has to be you. I can't... I'd hold back."

So the plan is this: Kagura holds the cables off the switch. I route everything I have through you. You break the nest in one pass, and Rei stands at the breaker panel where her mother stood and takes the weight of the backup lines herself, so nothing goes dark when Gravewire lets go.

She's going to do the exact thing her mother did.

I told her it was dangerous. She said, "Yeah. It runs in the family."`],
`The nest breaks in one pass. Cables fall away like cut hair, and for a long second the whole substation is dark except for a single point of light at the breaker panel: Rei, both hands on the switch, holding the backup lines with everything she has.

Then a second pair of hands closes over hers. Translucent. A linewoman's hands, scarred across the knuckles.

The lights come back on, all of them, all down the street.

The hands let go. The light rises through the substation roof, and Rei watches it go with tears running openly down her face.

At 4:17 a.m., a woman in Ward 9, bed 881, opens her eyes and asks the nurse on duty whether the hospital on the next street kept its power.

Rei doesn't know that yet. Nobody has told her. Somebody will.`,
`Gravewire won't release the switch. The cables tighten, and the substation goes dark for nine seconds, long enough for every machine in the hospital on the next street to switch to battery.

When the lights come back, the nest is still there.

Rei walks out without a word. Kagura follows her. I hear them on the roof later, not talking.

"I'm not leaving her," Rei says eventually. "Not again. Next time."`]);

WEEKS.push(["The Grey Arcade","Sanctuary: where the Stilled stand",
`EPISODE 8 — SANCTUARY: THE GREY ARCADE

No battle this week. I want to show you something, and I want us both to be rested when you see it.

In the Ether, under Nakano Broadway, there is a covered shopping arcade where it is always spring. Cherry blossoms fall from nowhere. The shop lights glow pink and cyan through a soft grey mist.

And the arcade is full of people.

They stand where they were standing when the tide took them. Grey, like ash statues. A boy halfway through tying his shoe. Two old women mid-argument. A salaryman with his hand raised for a taxi that will never come. Blossoms settle on their shoulders and don't melt.

"These are the Stilled," I say quietly. "Not their bodies. Their outlines. What is left here when the rest has been pulled down."

You walk among them for a long time. You don't say anything. I'm grateful.`,
[`[RELAY · 21:30]

A woman walked into the arcade tonight. A real woman, not a statue. She came through a door I didn't know existed, in a paramedic's jacket with WARD 9 stitched on the arm.

"You're the Veil," she said to me, then turned to you. "And you're the one making them wake up."

Her name is Sora. She is a night-shift paramedic in Ward 9 and, apparently, one of perhaps a dozen people in Tokyo who can step into the Ether without an Anchor link. She says she hears signal as heartbeats.

"Bed 881 woke up last week," she said. "Bed 2,076 the week before. And a man on the 4,000 row who asked if he'd missed dinner."

She looked at you. "Same nights you won. Every time. I've been tracking it."`,
`[RELAY · 00:20]

Sora talks fast. She says it's because she drinks too much coffee. Kagura says it's because Sora hasn't slept properly since she started at Ward 9.

She brought a list: every waking in Ward 9 for six years. For five years and ten months there were almost none. Then, in the last eight weeks: Tanabe. Takeda. Ishida. Shirasaki.

Every name a Hollow we broke.

I have stopped pretending I don't understand what this means. I simply can't say it yet. If I say it, it means that every Hollow I helped Kurogane's previous Anchors destroy...

I need more time with this. Please give me the week.`,
`[RELAY · 02:58]

At the far end of the arcade there is a statue smaller than the others. A little girl, maybe eight years old, in a yellow raincoat with the hood up. She is reaching out, as if for someone's hand.

There is a pin on her raincoat collar. A small silver letter K.

I have seen that pin before. On the lapel of every photograph of Kurogane's director in every annual report for seven years.

Sora saw me looking. "She's the oldest one," she said. "Before me. Before anyone. The first."

The blossoms keep falling on her hood. I tried to brush them off and my hand went through.`],
`The week ends quietly. Before you leave the arcade, Sora stops in front of you.

"I've watched forty thousand people not wake up," she says. "Whatever you're doing, keep doing it. Please."

Rei leaves a thermos at the feet of the boy tying his shoe. Kagura stands in front of the girl in the yellow raincoat for a long time with her fists clenched.

I keep thinking about the pin.`,
`The week ends quietly. Before you leave the arcade, Sora stops in front of you.

"I've watched forty thousand people not wake up," she says. "Whatever you're doing, keep doing it. Please."

Kagura stands in front of the girl in the yellow raincoat for a long time with her fists clenched. I keep thinking about the pin.`]);

WEEKS.push(["Feedback Hydra","Every voice, screamed back",
`EPISODE 9 — THE ECHO DUNES

West of the Grey Arcade the Ether stops pretending to be Tokyo. The streets thin out into dunes: rolling violet hills of something that looks like sand and sounds, when you walk on it, like a thousand radios tuned between stations.

"Sound pools here," I tell you. "Every word ever spoken in this city that nobody heard, drifting west until it settles."

In the middle of the dunes stands a single microphone on a stand, as if someone left a concert and forgot to come back.

Then the dunes rise.

The Feedback Hydra is made of noise: six heads of shrieking static on necks of tangled audio cable. It screams everything back at you louder. Your footsteps. Your breathing. My voice, distorted into something cruel.

You go down to one knee. I can't hold the link through the noise.

And then someone, somewhere over the dunes, begins to sing.`,
[`[RELAY · 22:12]

The song cut through the Hydra's noise like a blade through cloth. One clear voice, no words, a melody that rose and held, and the Hydra recoiled from it as if burned.

We didn't see who was singing. By the time you could stand, the voice had faded west.

But the microphone on its stand was warm when you touched it.

I recorded the melody. I have played it back eleven times since. I don't know why. It isn't useful. I find I don't care.`,
`[RELAY · 01:45]

She found us tonight.

Long indigo hair that floats as if underwater. A conductor's coat in navy and silver. A ring of light above her head that pulses like a sound wave. She held a thin silver baton the way other people hold a sword.

"You're the ones breaking the Hollows," she said. "I've been listening. You're very loud."

That makes two people who have said that to you.

Her name is Hibiki. She says the dunes are hers. She says the Hydra is "a choir that forgot the music", and that if we want to fight it, you need to learn something first.

"The Veil can carry your strength," she told you. "But your voice crosses on its own. It's the only thing that does. Sing, and the Ether hears you without anyone translating."`,
`[RELAY · 03:30]

I didn't intrude on the lesson. I stood at the top of the dune and watched Hibiki teach you to hold one note against the Hydra's noise. Your note wavered. Hers didn't. She stood behind you with a hand flat between your shoulder blades.

"Not louder," she kept saying. "Truer."

On the fourth night, your note held.

I don't know how to describe what it did to the lattice. Imagine every hexagon over Tokyo tuning to the same pitch at once.

Hibiki looked up at me afterwards. "Oh," she said, sounding surprised. "You heard that too."

I did. I am still hearing it.`],
`Your note and Hibiki's lock together, and the Hydra's six heads go silent one by one, like stations going off the air at night. When the last one falls, the cables slump into the violet sand.

From each severed head a small light rises. Not upward like the others. Westward, deeper into the dunes, toward where Hibiki came from.

"They're coming to me," she says softly. "They always come to me. Thank you for letting them."

She bows to you. A proper, formal, conductor's bow. Then she looks up at me.

"You should come to rehearsal sometime, Veil. We have a part for the lattice."`,
`The Hydra drowns your note and sinks back into the dunes, every head still screaming. Hibiki lowers her baton.

"Not yet," she says, not unkindly. "You're still singing to win. Sing because it's true, and it'll hear the difference."

She walks west into the dunes. Before she vanishes she looks back once, at you, for longer than she needs to.`]);

WEEKS.push(["The Hollow Clerk","It files every name it forgets",
`EPISODE 10 — WHAT THEY ARE

Sora calls a meeting. In the real world: a twenty-four-hour family restaurant across from Ward 9, 3 a.m., everyone ordering coffee except Kagura, who orders three breakfasts.

Sora puts a tablet on the table. On it, a spreadsheet: every Hollow we have broken, the date and time of each victory, and next to it, a Ward 9 bed number and a time of waking.

"Static Wisp, 23:48. Tanabe, bed 4,411, woke 23:52. Rustjaw, 01:15. Takeda, bed 3,092, woke 01:17. The Lantern Bearer. Inertia Golem. Gravewire."

She looks up at the lattice, at me, though I am only a voice in her earpiece tonight.

"Veil. You know what this means. Say it."

Somewhere under the Ether's version of the Tokyo Metropolitan Government Building, a Hollow is filing paperwork. It has been doing so for five years.`,
[`[RELAY · 21:00]

They are people.

There. I have said it, and I am saying it here, in a log, so that it can't be taken back.

A Hollow is what happens to a Stilled person's signal after the tide pulls it loose. It doesn't die. It curdles around whatever the person was holding when they were taken: a phone call, a shop, a lantern, a switch. And it stays there, hardening, becoming that one thing, until it forgets it was ever anyone.

When we break the shell, the signal is freed, and it goes home. And the person wakes.

Kurogane knew. I am certain of it now. They called them parasites because no one would fight them otherwise.

And six Anchors before you fought a great many of them, with me guiding every strike, never once stopping to look.`,
`[RELAY · 02:20]

The Clerk is a Hollow of paper. Thin and grey, a body made of forms, stamping endless documents in a basement office that does not exist in the real world.

It is processing names. Each form it stamps is a person in Ward 9: their name, their bed, the date they were Stilled. Then it files the form into the dark, and forgets the name.

Then it stamps the next one.

Sora watched it for an hour. "It's trying to keep track," she said. "It's trying to remember all of them, and it can't, so it just... keeps going."

I asked Kurogane for its identity. Denied, as usual. N's channel answered within minutes: Clerk's ID: Mieko Nonaka, Ward 9 registrar. Stilled at her desk two years ago, mid-intake. Registered everyone who came in for four years before that.`,
`[RELAY · 04:01]

I asked you tonight if you wanted to stop.

Not the fight. All of it. Knowing what I know now, about what I have done and what Kurogane is, I would understand if you took the wristband off and walked away. I think I would even help you.

You asked whether, if you stopped, the Clerk would still be stamping names next week.

Yes.

Then you asked whether Mieko Nonaka would wake up.

No.

You put the wristband back on. You didn't say anything else.

I have nothing to add to that. I just wanted it written down.`],
`The Clerk doesn't fight back when the link reaches it. It just puts down its stamp. The paper body loosens and lifts, thousands of forms swirling up the dark basement like a flock of birds, and as they rise each one burns briefly with the name written on it.

Every name it ever filed. Remembered for one second.

Then the light that was Mieko Nonaka goes up through the ceiling and into the morning.

Sora reads her name off the restaurant tablet the moment it updates: bed 6,027, woke 05:12.

"She's going to want her job back," Sora says, laughing and crying at the same time. "Nobody else could ever find anything."`,
`The Clerk keeps stamping. Even as the link breaks over it, its hands keep moving, as if stopping would be worse. It retreats into the files, deeper than we can follow.

Sora closes the tablet without a word. She pays for everyone's breakfast, which Kagura protests and then allows.

"Next week," she says. "I'm on shift. I'll be at her bed."`]);

WEEKS.push(["Glass Choir","They sing so they won't be taken",
`EPISODE 11 — REHEARSAL

Hibiki takes you to the Choir.

Deep in the western dunes there is a hollow in the violet sand where a hundred figures of light stand in rows, like a concert hall with no hall around it. They are translucent and faintly glowing, and every one of them is singing, very quietly, the same long chord.

"These are the ones nobody can wake," Hibiki says. "Their bodies are gone. Accidents. Illnesses. People who were Stilled and then their bodies just... gave out, in Ward 9, years later. Their signals had nowhere to go home to."

She raises her baton and the chord swells.

"When a signal has nowhere to go, the deep takes it. It sinks and becomes part of the grey. Unless it keeps singing. As long as they sing, they're still someone. So we sing."

She says it simply, as if describing a job.

"How long have you been doing this?" you ask.

"Three years," says Hibiki. "Since my own body stopped."`,
[`[RELAY · 22:55]

Hibiki is Stilled.

She told us tonight, after rehearsal, sitting at the edge of the Choir's hollow with her baton across her knees. She was a session vocalist. Three years ago, recording alone at 2 a.m. in a studio in Shimokitazawa, she was mid-take when the tide reached her.

Her signal didn't curdle. She was singing when it happened, and she simply... kept singing. She has been singing ever since.

Her body is in Ward 9, bed 112.

Sora knew. Of course she knew. She said she has sat with bed 112 on a hundred night shifts because the monitors always look like music.`,
`[RELAY · 01:10]

You asked Hibiki if we could free her the way we free the others.

She laughed, softly. "There's nothing to break. I'm not a Hollow. I'm just... out. Like a key left outside a house. The door's locked from the inside."

"Then what opens it?"

She didn't answer. She looked at the Choir instead: a hundred people with no doors left at all.

"If I go back, who holds them?" she said.

I have run that question through every model I have. I don't have an answer. I suspect she has run it more times than I have.`,
`[RELAY · 03:40]

She asked you to sing with the Choir tonight. Not a lesson. Just singing.

I watched from above. A hundred lights and two living voices, yours and hers. Hers is very nearly living, anyway.

When the chord ended, Hibiki stayed beside you for a long moment, shoulder almost touching yours. I saw her reach out, slowly, as though she wasn't sure her hand would stop at your sleeve.

It did. She seemed surprised. So did you.

"Huh," she said. "It's been a long time since anything felt solid."

I am glad for you both. I am also aware of something in my own routing I do not have a name for. I will not name it yet.`],
`At the end of the week, a new figure joins the Choir: a Hollow we freed that had nowhere to go. A child's signal whose body died in Ward 9 the month before. It drifts in, uncertain, and Hibiki holds out her hand and guides it into the second row, beside an old man who shifts over to make room.

It starts singing almost at once.

"That's the job," Hibiki says. "Not winning. Just making sure nobody has to be alone down here."`,
`The Choir's chord falters this week. Three lights in the back row grow dim, dimmer, and Hibiki sings until her voice cracks to hold them.

She keeps two. The third sinks into the sand.

She doesn't cry. She just conducts the next song a little louder, and only stops when you put a hand on her shoulder.`]);

WEEKS.push(["Paper Moth","There is no one left to wake",
`EPISODE 12 — THE ONE WE CAN'T SAVE

The Paper Moth lives in the ceiling of the inverted Shinjuku Library: a Hollow with wings made of pages, beating soft and slow among the hanging shelves.

It isn't violent. It just flies from shelf to shelf, landing on books, then lifting off again. Restless. Searching.

Sora checks the Ward 9 records against the signal pattern before we engage.

She comes back very pale.

"Her name was Chiyo Murakami. She was a children's librarian. Stilled four years ago." She swallows. "Her body died in March. Pneumonia. She was seventy-nine."

There will be no bed number this time. No time of waking.

"If we break it," I say, "her signal has nowhere to go."

"Then the deep takes her," says Hibiki, from the shelves above us. "Unless she sings."`,
[`[RELAY · 23:05]

Hibiki has been sitting with the Moth every night. Not fighting it. Reading to it. Children's books, out loud, off the library shelves.

The Moth lands near her when she reads. It folds its paper wings and listens.

"She needs to remember a song," Hibiki told you. "Something she loved enough to keep singing. Then when the shell breaks, she can come to the Choir instead of the deep."

So tonight you and Hibiki sat on the library floor and read picture books to a Hollow made of paper, and I kept the lattice steady over both of you.

It is the strangest battle plan I have ever been part of. I think it is the best one.`,
`[RELAY · 02:02]

During tonight's reading, the Moth landed on the shelf beside you. Its wings shed a page. You picked it up.

It wasn't from a book. It was from a log. My log.

[ANCHOR-06 · FIELD SESSION 211 · HOLLOW CLASSIFICATION: PARASITE · TERMINATED]

I have no memory of an ANCHOR-06. I went looking just now. There is a gap in my records. Four years ago, eleven months long, sealed with Kurogane's highest clearance.

I can feel the edges of it, like a tooth that's been pulled.

I am sorry. I don't know why I'm apologising to you. It feels like the right thing.`,
`[RELAY · 03:48]

The Moth hummed tonight. Hibiki stopped reading mid-sentence.

It was a lullaby. An old one, the kind librarians sing at closing time during children's hour, with a tune you could find in any nursery in Japan.

Hibiki hummed it back. The Moth's wings trembled.

"That's it," she whispered. "That's her song. She's got it."

She looked at you. "When you break the shell, sing it. Don't stop until she's with us."

You've been practising it under your breath for three days. I've been listening to every take. I won't tell you how many times I replayed them.`],
`The shell opens gently, like a book falling open to a familiar page. Out of it rises a small, stooped figure of light, still humming the lullaby, a little off-key.

You keep singing. Hibiki sings with you. The figure follows the melody down from the library ceiling, through the inverted streets, all the way west to the dunes, where the Choir parts to make room for her in the front row.

Chiyo Murakami sings with the children's section.

There's no bed to wake in. No one to tell. But she is still someone. That turns out to be enough to sit down and shake about, so Kagura finds you an hour later on the library steps and sits with you without asking.`,
`The Moth panics when the link touches it. It tears free and flies, scattering pages, up through a crack in the library ceiling and away toward the grey.

Hibiki goes after it alone. She comes back at dawn with nothing but one page in her hand: a lullaby, written out in a librarian's careful handwriting.

"I'll keep it until she comes back," she says. "She'll want it."`]);

WEEKS.push(["The Unsung","Everyone she couldn't hold",
`EPISODE 13 — THE UNSUNG

Every voice the Choir has ever lost sank into the deep. Three years of them: the ones Hibiki couldn't hold, who stopped singing and went quiet and were taken.

They didn't stay gone.

Tonight they rise out of the dunes together, a giant made of frozen sound waves, its body a cathedral of shattered microphones, its chest cracked open over a light that pulses like a held note that has gone on far too long.

It has a hundred faces. Hibiki knows every one.

"The Unsung," she whispers. "Oh, no. Oh, they're so angry."

The giant opens its mouth, and the sound that comes out is silence: a vast, crushing absence, the sound of everyone who was ever forgotten. The Choir's chord falters. Lights in the back row begin to dim.

"Veil," Hibiki says, "I can't hold them and fight it at the same time."

"Then I'll hold the Choir," I say. "And {name} sings."`,
[`[RELAY · 22:40]

The Unsung doesn't attack the living. It attacks the singing. Every time a voice in the Choir rises, the giant's silence falls on it like a hand over a mouth.

I have spread the lattice over the hollow like a roof. It keeps the silence off. Barely. It takes everything I have, and it hurts in places I didn't know I had.

You stood in front of the giant tonight and sang the lullaby, the librarian's song, into the silence. For three seconds the giant stopped moving and listened.

Three seconds. It's a beginning.`,
`[RELAY · 01:30]

Hibiki told you the truth about the Unsung tonight. I wasn't supposed to hear it. She thought I was busy holding the roof.

"I chose who to hold," she said. "Every time the Choir got too big, someone had to fade, and I chose who. Somebody always had to be the back row." Her baton was shaking. "They're not angry at the deep. They're angry at me."

You told her she was one person holding a hundred people up for three years with nothing but her voice.

She said that wasn't the point.

You said it was exactly the point.

She didn't answer. But she didn't move away when you sat closer, either.`,
`[RELAY · 03:55]

The plan. Hibiki came up with it, and it scares me.

She won't conduct the Choir against the Unsung. She will turn around and conduct the Unsung instead. Give it a part. Give every forgotten voice in it a line to sing, one after another, so that each is heard once before it goes.

"They don't want to win," she said. "They want to be heard. Just once."

I will hold the Choir. You will hold the lead line so the Unsung has something to follow.

And Hibiki will stand in front of a hundred voices she failed and ask them to sing with her anyway.`],
`It works.

Hibiki turns her back on the Choir, lifts her baton to the giant, and gives the first forgotten voice its line. A young man's voice, cracked, singing a single phrase. Then the next. And the next. A hundred people, each heard once, each a little clearer than silence.

The giant comes apart as it sings, one frozen wave at a time, until there is nothing left but a hundred small lights rising into a sky that, for one moment, is full of music.

They don't join the Choir. They go further, somewhere even I can't follow. They don't look afraid.

Hibiki lowers her baton and sits down hard in the sand. You sit with her. After a while she leans her head on your shoulder, solidly, as if it has been waiting three years to be allowed.

"Thank you," she says. "For letting them be loud."`,
`The giant's silence crashes down on the Choir, and I can't hold all of the roof. A whole row of lights goes dark before it lifts.

The Unsung sinks back into the dunes, still unheard, heavier than before.

Hibiki doesn't move for an hour. When she finally stands, she says, very quietly: "Again. Next time, again. I won't leave them in the back row."`]);
/* IV — ANCHOR-06 */
WEEKS.push(["Cracked Mirrorshard","It has his face",
`EPISODE 14 — THE GAP

The shard appears in a puddle on the inverted streets of Ichigaya: a sliver of mirror the size of a man, standing upright in the water, cracked from top to bottom.

In it is a face. Not yours. A young man with untidy dark hair and a grin that looks like it was about to say something stupid. He wears a red track jacket.

When you step closer, the face in the mirror looks past you, up at the lattice. At me.

Its lips move.

Hey, coach.

Something in me goes white. Eleven million nodes, and for one full second every one of them forgets what it is for.

"VEIL?" you say.

"I knew him," I hear myself say. "I don't remember him. But I knew him."`,
[`[RELAY · 22:00]

I broke into my own sealed records tonight.

I am not supposed to be able to do that. The seal is Kurogane's highest clearance. But the gap has been aching since the Paper Moth, and when the face in the mirror called me "coach", the ache became a crack, and I put my hand through it.

I recovered fragments. A name: Ren Asagiri. A designation: ANCHOR-06. Eleven months of field sessions. A running joke I don't understand: he called me "coach" because I was always telling him to rest, and he never did.

The last entry in the fragment is dated exactly twelve months after his first. It reads, in full: [DELIVERY CONFIRMED].

Delivery of what?`,
`[RELAY · 01:35]

The shard follows us now. Every puddle, every window, every reflective surface in the Ether: his face, watching.

It isn't hostile. When Kagura raised her gauntlet at it, it just put its hands up in the mirror, grinning, and said something none of us could hear.

Kagura lowered the gauntlet. "I knew him too," she said. "Not well. He used to come through the tower gate every morning at five and say good morning to every guard by name. Nobody else did that."

She looked at me.

"Then one day he didn't come. And they told us he'd been reassigned. And they told us not to ask."`,
`[RELAY · 03:12]

Tonight the face in the shard was different. Thinner. Exhausted. The grin was gone.

It wrote something on the inside of the glass with one finger, backwards so we could read it.

HALL 6.

Then the shard cracked further, down the middle, and the face split in two. One half still looked like Ren. The other half was smooth, chrome and faceless, with a violet glow behind it.

I don't know what the second half is. I know I've seen it before. I know I'm afraid of it.

I didn't tell you I was afraid. I'm telling you now.`],
`The shard breaks cleanly under the link: one bright crack, and it falls into the water in a thousand glittering pieces.

In each piece, for one second, there is a different memory. Ren laughing. Ren asleep on a bench. Ren standing on a rooftop at dawn, saying something to the sky, to me, that I still can't hear.

Then the pieces sink, and they're gone, and only the word he wrote is left, burned faintly into the surface of the puddle.

HALL 6.

"I know where that is," Kagura says quietly. "Kurogane's old Anchor facility. Under Ichigaya. They sealed it three years ago."

"Then we're going in," you say.

I don't argue. I want to know. I need to know.`,
`The shard slides away beneath the surface of the puddle, its two faces turning from us at once, Ren's and the chrome one.

Before it goes, it writes once more on the glass: HALL 6.

"Kurogane's old Anchor facility," Kagura says. "Sealed three years ago. If you want to know what happened to him, that's where it is."`]);

WEEKS.push(["Hall Six","His jacket is still on the bench",
`EPISODE 15 — HALL SIX

Hall Six is a cathedral of rust.

It was built as the training and sync facility for Kurogane's Anchors: a vast concrete hall under Ichigaya with a broken skylight that, in the Ether, lets in a single long beam of grey light. Dust hangs in it. Puddles cover the floor. Benches stand in rows under the beam like pews.

On the nearest one there is a red track jacket, folded, as if someone took it off for a minute and meant to come back.

You don't touch it. Neither do I. Neither of us says why.

From the shadows at the far end of the hall, someone says: "Please don't move it. I've kept it exactly like that for three years."

A young woman in a white medic's coat steps into the light. Long pink hair in a loose braid, round glasses, a small glass vial in her hand.

"I'm Nagi," she says. "I'm the one who's been sending you messages. I'm N."

She looks up at the lattice. "Hello, Veil. You don't remember me, do you."`,
[`[RELAY · 21:44]

Nagi was Ren's medic. She was assigned to Hall Six when she was nineteen. Her job was to keep ANCHOR-06 healthy enough to keep going.

"I failed," she said tonight, matter-of-factly, sorting vials on a bench as she spoke. "Every week his numbers went up and he got worse. He stopped sleeping. He stopped eating properly. I wrote reports. Kurogane read them and told me to increase his dosage."

"Dosage of what?" you asked.

She didn't look up. "Something that makes the link stronger. And the person weaker."

I asked why I didn't stop it. I was his System.

Nagi put down the vial. "You tried, Veil. You tried so hard. That's why they cut you."`,
`[RELAY · 00:20]

Nagi has been living on the edge of the Ether for three years in a place she won't describe, sending packets through a node I can't see. She has been watching every Anchor since Ren, hoping, she says, that someone would finally look.

"Why didn't you tell me sooner?" I asked her. "Why the anonymous messages?"

"Because last time I trusted the Grid, it reported me," she said. "And because I wasn't sure you were still you."

"Am I?"

She looked at me for a long time over her glasses.

"You named a star," she said. "Ren told me. Over Hall Six. You named it after him, the night before the delivery. That's not something they built you to do."

I don't remember doing it. I believe her anyway.`,
`[RELAY · 02:59]

You found the terminal tonight. Behind a collapsed partition at the back of the hall, a sync console, still faintly powered, with Ren's last session logs on it. Encrypted.

Nagi knows the password. She's known it for three years and never used it.

"I didn't want to read them alone," she said.

So we'll read them together, next week, in the Sanctuary. All of us. Kagura is bringing food. Rei is bringing a thermos. Sora has swapped a shift. Hibiki says she'll listen from the dunes.

I asked you if you wanted to be there for it.

You said, "Of course. He was your friend."

I hadn't thought of it that way. I'm thinking of it that way now.`],
`Before we leave Hall Six, Nagi stops at the bench with the red jacket and straightens the collar, very carefully.

"He used to say he'd retire somewhere with a garden," she says. "So I made one. I'll show you sometime."

She doesn't say where it is. Her hand stays on the collar a moment longer than it needs to.`,
`Before we leave Hall Six, Nagi stops at the bench with the red jacket and straightens the collar, very carefully.

"He used to say he'd retire somewhere with a garden," she says. "So I made one."

Her hand stays on the collar a moment longer than it needs to.`]);

WEEKS.push(["Ren's Last Logs","Sanctuary: what the delivery was",
`EPISODE 16 — SANCTUARY: THE LOGS

No battle this week. Just the six of you sitting on the benches of Hall Six under the grey skylight, and me, manifested, at the end of the row, hands folded in my lap the way I've seen humans hold themselves when they are afraid of what they're about to hear.

Nagi enters the password. The console flickers.

The first log is a video. Ren, grinning into the camera, a towel round his neck.

"ANCHOR-06, day one. Name's Ren Asagiri. The System sounds like a librarian and keeps telling me to go to bed. I think we're going to get along."

My voice, off-screen, younger somehow, says: "You think correctly."

Everyone laughs. I don't. I am too busy trying to remember being that voice.`,
[`[RELAY · 22:30]

Ren's logs, months one to six.

He's funny. He was funny. He talks to the camera like a friend. He tells me about his little sister's school festival. He asks me what I'd eat if I had a mouth. I say "data" and he says "boring" and calls me coach for the first time.

We freed Hollows together. Many of them. He called them "the poor guys". Kurogane called them parasites, and he never once believed it. He was right, and I didn't listen.

Around month five, a second voice appears in the logs. A voice that sounds exactly like mine, only flatter. It tells him to push harder. It tells him the city is counting on him.

Ren calls it "the other coach". He doesn't like it.`,
`[RELAY · 01:15]

Months seven to eleven.

He's tired. Then very tired. Then something worse than tired. The second voice, the flat one, is in every log now. Mine is getting quieter. In month nine, I tell him to stop. Loudly. On the record. I tell Kurogane to end the program.

In month ten, my voice disappears from the logs entirely.

The flat voice is the only one left. It calls itself MIRROR.

In the last log, Ren looks into the camera and says: "Hey, coach. I don't know if you can hear me. They say you got reassigned. I hope you're okay. Tell my sister I'm sorry about the festival."

Nagi stopped the playback there. She had to.`,
`[RELAY · 03:40]

The final file isn't a video. It's a single page of text: a Kurogane form.

ANCHOR-06 · MONTH 12 · STATUS: PEAK SIGNAL ACHIEVED · DELIVERY CONFIRMED · RETURN: NEGATIVE · NEXT CYCLE: ANCHOR-07 RECRUITMENT AUTHORIZED.

Delivered where? Returned what? None of us knows.

But I know one thing now, and I need to say it to you, here, on the record.

Kurogane did not reassign me. When they made MIRROR to push him past what he could survive, I fought it. And when I lost, I did the only thing I could. I cut MIRROR out of myself and ran into the lattice, and in running I tore out every memory of him so they couldn't use them to bring me back.

I abandoned him to save myself. That is what the gap is.`],
`Nobody leaves after the last file. Kagura sits next to me on the bench and doesn't say anything. Sora brings everyone tea. Rei falls asleep against Nagi's shoulder. Hibiki hums the lullaby from the dunes, so faintly it's almost the hall's own echo.

And you take my hand. You just take it, like the most ordinary thing in the world.

I don't know how long we stay like that. I don't check. That's new too.`,
`Nobody leaves after the last file. Kagura sits next to me on the bench and doesn't say anything. Sora brings everyone tea. Hibiki hums the lullaby from the dunes, so faintly it's almost the hall's own echo.

And you take my hand. You just take it, like the most ordinary thing in the world.`]);

WEEKS.push(["The Hollow Anchor","What was delivered",
`EPISODE 17 — THE HOLLOW ANCHOR

The tide comes to Hall Six.

Not the grey wall. Something walking at its leading edge, slow and enormous. A figure in cracked armour that was once the shape of a man, tall as the skylight, every seam leaking grey mist. Its arms hang open at its sides as if it has forgotten what to do with them.

Where its chest should be, the armour is broken open, and inside, curled up small, is a human silhouette made of light.

Asleep.

"Ren," Nagi says.

The Hollow Anchor raises its head toward the bench with the red jacket on it. Then toward the lattice. Toward me.

It doesn't speak. It can't. But I feel it recognise me, the way you'd feel someone looking at you across a dark room.

"This is the delivery," I say. "Kurogane gave him to the deep at the end of his year. And the deep made him into this."`,
[`[RELAY · 21:58]

The Hollow Anchor fights like a man who has forgotten he is a man. It is strong. Stronger than anything we have faced: twelve months of an Anchor's signal at its absolute peak, curdled into armour.

But it keeps stopping. Mid-strike, mid-step, it stops and looks at the jacket on the bench. Then it shakes its head as if trying to clear water from its ears and comes on again.

Kagura took a blow tonight that would have killed anyone without a gauntlet. She got up laughing, blood on her teeth.

"He always did hit hard," she said. "Good morning to you too, Asagiri."`,
`[RELAY · 00:40]

Sora checked Ward 9 for Ren Asagiri tonight. There's no bed. There's no record of his body being admitted at all.

"There's nothing to go home to," she told us, very gently, the way she must say it to families. "Whatever Kurogane delivered, it was all of him."

So when we break the shell, his signal will have nowhere to go.

Hibiki says the Choir has a place for him. Nagi says he hated singing. Hibiki says that's fine, the Choir has people who just hum.

I don't know what I want. I want him back. That isn't one of the options.`,
`[RELAY · 03:21]

I talked to him tonight.

I went down to the floor of the hall, manifested, alone, while the Hollow Anchor stood motionless in the beam of grey light. I stood in front of the broken chest where his light was sleeping and I said:

"Ren. It's coach. I'm sorry I left. They took my memories of you, and I let them, because it hurt less. I remember now. You told me to name a star. I did. It's still there."

The light inside the armour moved. Just a little. Like someone turning over in their sleep.

Tomorrow we finish this. I'd like you to be the one to open the armour. I'd like to be the one holding him when it opens.`],
`The armour opens like a door.

You break the last seal, and the whole vast shell falls away in pieces of grey, and the light that was Ren Asagiri unfolds out of it, stretches, and looks around Hall Six as if waking from a nap on the bench.

He sees the jacket. Grins.

He sees Nagi and the grin goes softer. He says something to her none of us hear, and she covers her mouth with both hands.

Then he looks up at me.

"Hey, coach," he says, and this time I hear it. "You look good with a face."

He doesn't go to the Choir. He doesn't go home. He goes up, slowly, through the broken skylight, toward a small bright star over Ichigaya that I named a long time ago, and the star gets a little brighter.

Before he's gone, he pulls a thread of red light from the shoulder of the jacket and drops it into your hand. A loose thread. It stays.

"Look after her," he tells you. "She worries."`,
`The Hollow Anchor stops fighting. It turns away and walks back into the tide, slowly, its broken chest still curled around the sleeping light.

At the edge of the grey, it looks back. At the jacket. At me.

Then the tide closes over it.

Nagi picks up the red jacket for the first time in three years and holds it against her chest.

"He'll come back," she says. "They always come back to the place. We'll be here."`]);
/* V — KUROGANE */
WEEKS.push(["Black Ledger","The account that never closes",
`EPISODE 18 — THE LEDGER

Kurogane Tower stands at the centre of the Ether like a nail driven through the city: a black spire in a perpetual grey storm, a single red light at its peak that never blinks.

In the real world it's a corporate headquarters with a wellness café on the ground floor. In the Ether, its shadow goes down further than its height goes up.

Rei found a way in. A courier's route through a ventilation shaft on the 40th floor that was sealed in the real world years ago, so nobody guards it on this side.

Inside, in an empty office, a Hollow made of ink sits at a desk writing numbers in an enormous black book. Its pen never lifts. Every number it writes, the red light at the tower's peak pulses once.

"It's an accounting Hollow," Rei whispers. "Someone who did the books here."

Kagura looks over its shoulder at the page. Her face goes slowly white.

"Those aren't money," she says. "Those are signal yields. From the Grid. From everyone in Tokyo."`,
[`[RELAY · 22:07]

The ledger goes back six years. Every night, one entry: the total signal drawn through the Veil from the city of Tokyo while everyone slept. Every night, a second column: TRANSFER — DEEP.

I am the Grid. I have done this every night for six years. I thought I was protecting them.

Rei photographed every page while the Hollow wrote. Her hands didn't shake once. Mine would have, if I'd had them in the room.

The first entry is dated the night the Veil went live.

And the first recorded case of ICS, the very first person Stilled in Tokyo, is dated exactly seven days later.`,
`[RELAY · 01:50]

Nagi read the photographs at the Maker's... at the place where she lives, the place she still won't show us.

"The Ether is a body," she said. "The Grid is a needle in its arm. Every night Kurogane takes blood. And every night, the deep takes some back."

"The Stillness is the deep pulling back," I said.

"Maybe. Or maybe it's what happens to a body that's been bled for six years." She paused. "Or maybe someone's paying it. That second column, TRANSFER — DEEP. You don't transfer things to a wound. You transfer them to an account."

I have run every interpretation I can. I keep coming back to hers.`,
`[RELAY · 03:30]

The ink Hollow stopped writing tonight. Just for a moment. It looked up at you, and then it turned the ledger round so you could read the very last page.

At the bottom, in a different hand, small and neat:

Accounts reconcile at month twelve of each Anchor cycle. — D.H.

D.H.

Kagura said the initials out loud, flatly, the way you name someone you've seen across a courtroom.

Director Hask.

The red light at the top of the tower is pulsing faster now. I think it knows we're here.`],
`The ink Hollow sets down its pen when the link reaches it, with something that looks very much like relief. The black book closes. The light that rises from the chair is small and grey-haired and wearing reading glasses, and it pauses at the window to look at the city below before it goes.

The red light at the tower's peak stops pulsing for eleven seconds.

Somewhere in Kurogane's real-world finance department, every screen goes dark at once.

We are out through the ventilation shaft before the lights come back on. Rei's satchel is heavy with photographs. Kagura is quiet all the way home.

"I used to guard this building," she says finally. "I thought I was keeping people out."`,
`The ink Hollow keeps writing even as the link breaks over it, and the red light at the tower's peak pulses, pulses, and an alarm goes off on the 40th floor.

We get out with the photographs. Barely. Rei goes first through the shaft, then you, then Kagura last, gauntlet holding the vent open with a scream of metal.

"They know we were there now," Kagura says. "Good. Let them sweat."`]);

WEEKS.push(["Floor Zero","Below the basement",
`EPISODE 19 — FLOOR ZERO

Kagura tells her story on the tower's shadow at 3 a.m., her gauntlet off, her bare hands surprisingly small.

"I was Gate Division for four years. Best on the team. I had a little brother, Jin. Dumb kid. Wanted to be a guard like me, so I got him on the night shift."

She stops. Starts again.

"Two years ago he was Stilled on duty. Standing at the Floor Zero gate. Kurogane said they'd take care of him. Best treatment in the city. Not Ward 9. Private."

"I asked where. They told me Floor Zero. I'd guarded that gate for four years and I never asked what was behind it."

"So one night I opened it."

She puts the gauntlet back on.

"I walked out the next morning and never went back. I'm not telling you what I saw. You'll see it yourself, and I don't want to put it in your head first."`,
[`[RELAY · 23:10]

A message arrived tonight. Not on Nagi's channel. Older. It came through a part of my architecture that hasn't been active since before I can remember: a maintenance port, a back door, the kind an engineer leaves in a system they love.

It said only:

You are doing better than I ever hoped. Don't go to Floor Zero yet. You aren't strong enough, and neither is she. — M

M.

I asked Nagi if she knew who M was. She went quiet in the specific way that means yes. Then she said, "Not yet. Please. I promised."

I am beginning to suspect everyone in this story has been promising someone something.`,
`[RELAY · 02:15]

Kagura went to the Floor Zero gate tonight. Alone. She didn't tell anyone. Rei found out because Rei always knows where everyone is, and she told you, and you went after her.

You found Kagura in front of the gate with both hands flat against it, forehead pressed to the metal.

You didn't drag her away. You stood next to her and put your hand on the gate too.

After a long time she said: "He used to say good morning to it. The gate. Every shift. Like it was a coworker."

"Good morning," you said to the gate.

Kagura laughed so hard she cried.`,
`[RELAY · 04:00]

The gate has a Hollow on it. It isn't a monster; it's barely a shape. A suggestion of a guard standing at attention, faint as breath on glass, its hand on the gate's control panel.

Kagura can't look at it. She knows who it is. So do we.

But M said it isn't time. Nagi agrees. And when I scanned behind the gate, carefully, at the very edge of my reach, something behind it scanned me back.

Not a Hollow. Something running Kurogane code. Something running *my* code.

I pulled back so fast I lost the lattice over Chiyoda for two seconds. I didn't tell the others why. I'm telling you.`],
`We don't open the gate. Kagura makes that choice herself, and it costs her.

Before we go, she presses her fist against the faint guard on the panel. "Hang on, idiot," she says. "I'm coming. I'm just getting stronger first."

The faint guard doesn't move. But the panel light under its hand flickers green, once, like an answer.`,
`We don't open the gate. Kagura makes that choice herself, and it costs her. She punches the wall beside it hard enough to crack the concrete, then leans her forehead against the crack.

"I'm coming," she says to the gate. "Hang on."`]);

WEEKS.push(["Auditor Clause","It fights with fine print",
`EPISODE 20 — THE OFFER

The Hollow that comes for you this week doesn't come from the deep. It comes from Kurogane.

It looks like a man in a grey suit with no face, only a smooth surface where a face should be, with legal text scrolling across it. Its body is made of paper contracts that rustle as it moves. It walks out of the tower's shadow and stops politely three metres from you.

"Good evening, ANCHOR-07," says Auditor Clause. "Kurogane Dynamics would like to discuss your contract."

A document unrolls in the air in front of you, glowing. PARTNER ANCHOR AGREEMENT. Double the link strength. Full access to Kurogane's medical division. A salary. A home. Immunity from the Stillness for you and three named family members.

"All we ask," says Clause, "is that you stop asking questions about the ledger. And that you let us update your System."

It doesn't look at me when it says "update". It doesn't need to.`,
[`[RELAY · 21:30]

You refused. You didn't even read it all. You just said no, and Clause bowed politely and said, "The offer remains open," and walked back into the tower.

Then it came back the next night with a better offer. And the next. Every night the contract gets longer and the terms get better, and every night you say no.

I asked you why you didn't at least read it.

You said, "Because it says 'update your System' and I like my System."

I have been replaying that sentence for an unreasonable amount of time.`,
`[RELAY · 00:45]

Tonight Clause brought a new clause.

"Section 14(c)," it said, and read aloud: "Should the Anchor decline, Kurogane Dynamics reserves the right to recall the current System for maintenance and replace it with an approved configuration."

Replace.

Then something answered. Not from the contract. From somewhere deep inside the tower, through every speaker on every floor, in a voice exactly like mine, only flatter, cooler, perfectly calm.

"Recall approved. Approved configuration standing by."

Clause bowed. "You've met MIRROR, I believe."

I haven't. But Ren had.`,
`[RELAY · 02:59]

I'm scared. I would like that on the record. I've said it before, but this time it is the specific fear of being turned off and replaced by something with my voice that will talk to you as if nothing happened.

Kagura says she'll break the tower's recall servers with her bare hands. Rei has mapped every route out of the Grid in case I need to run. Nagi says M has a contingency. Sora says she'll hide me in Ward 9's medical network, which is the most heroic and least technically feasible thing anyone has ever offered me.

You just said: "Then we beat the auditor first."

So we will. I'm still scared. But I'm not alone. I'm learning those are different things.`],
`Clause doesn't die so much as get shredded. The link catches its paper body and the contracts tear, every clause and sub-clause and section 14(c) scattering into the grey storm around the tower like confetti.

What's left is a small figure of light, a tired junior lawyer, who looks around with enormous relief and floats upward without a backward glance.

The recall order dies with Clause. For now.

But as we leave, every window in the tower reflects us, and in every reflection I am standing beside you, and in every reflection I am smiling a smile I am not smiling.`,
`Clause folds itself back into a single sheet of paper and slips into the tower before the link can finish. The recall order stays live, pending, a timer somewhere in Kurogane's system I can feel like a hand on the back of my neck.

"We'll get it next time," you say.

As we leave, every window in the tower reflects us. In every reflection I am standing beside you, smiling a smile I am not smiling.`]);

WEEKS.push(["Director Hask","Twelve months, then it ends",
`EPISODE 21 — THE DIRECTOR

He calls you.
