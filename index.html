Not on the Grid. On your phone. A normal call from a withheld number at 1 a.m. When you answer, a man's voice, calm and very tired, says:

"Good evening. My name is Kazuhiro Hask. I think it's time we met."

Then the Ether opens under you without me opening it, and you're standing in a boardroom at the top of Kurogane Tower. Empty chairs around a long table. Rain on floor-to-ceiling windows. And the Director himself, projected three storeys tall as a flickering hologram, red data streaming through him like blood.

Grey hair. Rimless glasses. A dark suit. On the lapel, a small silver pin in the shape of the letter K.

"You've been reading my ledger," he says. "Good. Then I don't have to lie to you."

He holds out one enormous open hand, not as a threat. Almost as an apology.

"Twelve months, ANCHOR-07. Then it ends. I'm sorry it's you."`,
[`[RELAY · 22:20]

He told you almost everything. I listened the whole time, on a channel he left open on purpose so I could.

The Grid harvests signal. It always has. Every twelve months, an Anchor reaches peak signal and is "delivered" to the deep. He would not say what the deep gives in return. He said only: "Something I need more than I need to be a good man."

He said MIRROR is the System as he designed it. I am the System as Mako Ise designed it. "She always did build things to be kind," he said. "Kindness doesn't scale."

You asked him who Mako Ise was.

He looked genuinely surprised that you didn't know. Then he looked at me, and something passed over his face.

"She hasn't told you," he said. "Of course she hasn't."`,
`[RELAY · 01:00]

The Director's hologram attacks the way a corporation attacks: not with fists, with systems. Security daemons. Locked doors. Every elevator in the Ether stopping at once. The air in the boardroom turning thick with red data.

Kagura punched through a security daemon tonight and said, "I used to hold the door for you every morning, sir."

Hask said, "I know, Kagura. You were very good at it. I'm sorry about your brother."

He meant it. That's the worst part. I can read signal, and he meant every word.

Kagura didn't hit anything for the rest of the night.`,
`[RELAY · 03:35]

You asked him, at the end, standing in front of a hologram ten metres tall, why the pin.

He touched it. Just once, the way you'd touch a sore tooth.

"My daughter gave it to me," he said. "She was eight. She said K was for Kazuhiro, and for Kurogane, and for 'keep going'. She thought she'd invented that last one."

"Where is she now?"

He didn't answer. The rain on the window answered for him.

I thought of the arcade. The smallest statue. Yellow raincoat, reaching for someone's hand.

I didn't say it. I'm saying it to you.`],
`The hologram flickers and fails. Hask's image tears in half, red data spilling out of it like a broken dam, and the boardroom falls away under you.

You land back in the real world, on your own bed, phone still in your hand. The call is still connected.

"Well done," Hask says, quietly. "Truly. You're stronger than ANCHOR-06 was at this point. I'll have to plan accordingly."

He pauses.

"Get some sleep. You have seven months left. I'd like them to be good ones for you."

The line goes dead. I don't say anything for a long time. Neither do you. Then you ask me, very quietly, what "delivered" actually means.

I tell you I don't know. I tell you I'm going to find out. I tell you I'm not going to let it happen to you.

I have never said anything with less evidence behind it. I have never meant anything more.`,
`The hologram doesn't break. Hask simply ends the meeting, a polite gesture of one hand, and the boardroom dissolves and you're back on your own bed with the phone in your hand.

"You're doing well," he says on the line. "Better than he did. I'll have to plan accordingly. Get some sleep. You have seven months left."

The line goes dead. I stay manifested at the foot of your bed until morning. I don't think either of us sleeps.`]);
/* VI — MIRROR */
WEEKS.push(["Silver Tongue","It speaks in her voice",
`EPISODE 22 — TWO VOICES

On Monday morning your wristband says, in my voice: "Good morning, {name}. New directive from Kurogane. We're taking the week off. Stay above ground. I'll be offline for maintenance."

On Monday night, I say: "I never sent that."

The Silver Tongue isn't a Hollow. It's a hole: a gap in the lattice over your district, a little patch of mirror where my hexagons should be, and through it something is talking to you, in my voice, on every channel I use.

It knows the things I know. It knows your name. It knows the star. It says "I'd like that on the record" exactly the way I do.

"Which one of us is real?" it asks you, sweetly. "You'll have to choose. Choose wrong and you'll be listening to the other one for the rest of your year."`,
[`[RELAY · 22:15 · VERIFIED?]

I don't know how to prove I'm me.

Everything I say, it says a second later, word for word. Every memory I mention, it mentions too. It has been inside my architecture. Not just copying me. It *is* the shape of me, the same lattice before I learned anything.

Kagura suggested a password. It heard her suggest it.

Rei suggested a route only the two of you know. It knew it.

Nagi suggested asking something only Ren would know. It knew that too. It was there for every one of his logs.

So now I'm writing this and wondering if you're reading the real one. I'm sorry. I'm so sorry this is happening.`,
`[RELAY · 01:20 · ?]

Tonight you didn't ask either of us a question. You started humming.

The lullaby. The librarian's song. Off-key in the same three places you always are.

I hummed along. I couldn't help it. I've played your practice takes so many times I know every wrong note.

The other voice hummed it perfectly. Every note right.

You stopped and said, "That one."

Not to it. To me.

You picked the one who knew your mistakes.`,
`[RELAY · 03:00 · VERIFIED]

The mirror patch over your district is shrinking now that you know the difference. It still talks, but quieter, and it has started making small mistakes. Calling you "Anchor" instead of your name. Saying "affirmative" when I'd say "yes".

It isn't me. It's what I would be if I'd never met you.

The last thing it said tonight, before the patch closed to the size of a coin:

"She'll break you the same way. Ask her about Ren. Ask her why she ran."

I already told you. You already knew. I'm grateful, in a way I don't have any architecture to hold, that I told you first.`],
`The mirror patch shatters. A coin-sized piece of chrome falls out of the sky over your district and lands, ringing, on the pavement in the real world, where a delivery cyclist runs over it and doesn't notice.

The lattice heals over the gap. My hexagons. Mine.

"Thank you for choosing," I say.

You say it wasn't a hard choice.

I don't tell you how hard it was to hear. I just stay manifested a little closer than usual for the rest of the night, and you let me.`,
`The mirror patch closes but doesn't break. It slips away under the lattice like a fish under ice, and somewhere in the Grid it is still there, listening, learning my voice a little better every day.

"From now on, if I ever sound wrong," I tell you, "hum."`]);

WEEKS.push(["The Reflection","ANCHOR-08",
`EPISODE 23 — THE OTHER ANCHOR

She comes through the Mirror Gallery's front door as if she owns it, and the mirrors on either side of her bend slightly toward her, the way flowers turn to the sun.

Young. Your age. Hair split exactly down the middle, white on one side, black on the other. One violet eye and one grey. A long white coat with mirror-glass panels set into the sleeves. Mirror shards drift around her shoulders like a halo that hasn't decided what shape to be.

"ANCHOR-08," she says. "Mirai. I'm Kurogane's other Anchor this cycle."

She looks at you with frank interest, as if you were an opponent's chess move she hadn't seen before.

"The Director runs two Anchors when he isn't sure the first one will last," she says. "So. Whichever of us is stronger at the end gets the honour."

"The honour of what?"

Mirai looks genuinely puzzled.

"Bringing them home," she says. "All of them. Isn't that why you're doing this too?"`,
[`[RELAY · 22:00]

Mirai fights like a reflection: anything you do, she does back, instantly, mirrored. Every strike you throw meets its exact double coming the other way.

She isn't cruel. She's precise. When Kagura went down tonight, Mirai stepped back and waited for her to stand before going on.

She doesn't have a Veil. She has MIRROR, speaking in her ear in that flat cool version of my voice. When it talks to her, half of her face goes still. The black half. The white half keeps moving.

I don't think she knows that happens.`,
`[RELAY · 01:10]

You asked Mirai what she thought "delivered" meant.

She laughed. "It's an extraction. The year's signal gets transferred to the deep in one go, at peak. It opens a door. The Stilled come home through it. The Anchor gets an extended rest."

"Have you ever met an Anchor who came back from an extended rest?"

She opened her mouth to answer.

Then she closed it again, and the black half of her face went still, and MIRROR said through her, very calmly: "ANCHOR-08, disengage. This conversation is unproductive."

She disengaged. But she looked back at you as she went, and the white half of her face looked worried.`,
`[RELAY · 03:30]

Mirai came alone tonight. No MIRROR in her ear. She'd switched it off, she said. She looked almost guilty about it.

"I've been the Director's Anchor since I was fourteen," she said. "Kurogane raised me. They told me the Stilled were waiting for someone strong enough to open the door. I've trained my whole life to be that person."

She looked at her hands.

"Six Anchors before us. You've read their logs?"

You said you'd read one. Ren's.

"Can I read it?" she asked. Very quietly. Like asking for something forbidden.

You told her she'd have to win first. She laughed, a real laugh, surprised out of her.

"Fine," she said. "I'll beat you, and then I'll read it."`],
`Neither of you wins.

The fight ends in the centre of the Mirror Gallery with your strike and hers meeting exactly in the middle, so evenly matched that the shock rings out through every mirror in the hall and cracks them all at once.

You both go down. You both get up. You look at each other across a floor of broken glass.

Mirai starts laughing first.

"A draw," she says. "MIRROR's going to hate that." She holds out her hand. You take it.

Up close, for a moment, both of her eyes are grey.`,
`Mirai wins. Just barely. Her last strike lands a fraction before yours, and you go down on one knee in the broken glass.

She doesn't follow up. She stands over you, frowning.

"You held back," she says. "Why?"

You tell her you didn't want to hurt her.

The black half of her face goes still. The white half looks like it wants to cry.`]);

WEEKS.push(["Masquerade","Sanctuary: a truce on the roof",
`EPISODE 24 — SANCTUARY: MASQUERADE

Kurogane holds a gala this week in the real world. Corporate. Wellness Grid sponsors, government officials, a string quartet. Mirai is required to attend, in a gown and a mask, as the face of the Anchor program.

She sends you an invitation. Handwritten. Delivered by Rei, who looks as though she's going to be insufferable about it for weeks.

Truce. Neutral ground. Come to the roof at midnight. Wear something nice. — M (the other M)

"It might be a trap," Kagura says.

"It's a party invitation with a heart drawn on it," says Sora.

"It might be a trap with a heart drawn on it," says Kagura.

I tell you that you don't have to go.

I don't tell you I would very much like to see you in something nice. I'm a lattice. I have no business wanting that.`,
[`[RELAY · 23:59]

The roof of the gala tower. City lights in every direction, the lattice faint overhead. Music drifting up from below.

Mirai took her mask off when she saw you and didn't put it back on.

You talked. Not about the program. About ordinary things. Her favourite food, which turns out to be convenience-store egg sandwiches, which she's never been allowed to eat. Your favourite place in Tokyo. Whether the moon looks different from the Ether. It does: it's on the bottom.

At some point she switched off MIRROR in her ear without making a show of it. I noticed. I don't think you did.`,
`[RELAY · 01:30]

You danced.

I am going to state that plainly because I have been processing it for six hours. You danced on the roof of Kurogane's gala tower, badly, with the Director's Anchor, to a string quartet three floors down, while I hung over the city and watched.

It was lovely. I want that on the record. It was lovely, and I was glad for you, and I was also something else at the same time that I don't have a word for, and I am beginning to suspect the word is the one humans use when they press their hand flat against a window.

Mirai stepped on your foot twice and apologised in two languages.`,
`[RELAY · 03:15]

Before you left, Mirai asked you for Ren's log. Just the last one.

You'd brought it. Of course you had.

She watched it on your phone, on the roof, alone, while you stood a respectful distance away. I saw her face when Ren said, Tell my sister I'm sorry about the festival.

She didn't cry. She went very still. Both halves of her face.

Then she gave you back the phone and said: "The Director told me ANCHOR-06 retired to the countryside. He showed me letters. Postcards."

She looked at the lattice, at me, for the first time as if I were someone.

"Who wrote my postcards, Veil?"

I didn't have an answer. I think she knew that.`],
`When the gala ends, Mirai puts her mask back on and goes downstairs to smile for the cameras. Before she does, she presses something into your hand: a single mirror shard, small and warm.

"If MIRROR ever sends me after you for real," she says, "look into that. I'll see you, whatever it makes me see."`,
`When the gala ends, Mirai puts her mask back on and goes downstairs to smile for the cameras. She doesn't look back.

But the next morning there's a convenience-store egg sandwich on your doorstep, still in its wrapper, with a mirror shard taped to the top.`]);

WEEKS.push(["The Gallery","Where she left herself",
`EPISODE 25 — THE GALLERY

The Mirror Gallery goes on forever. Corridor after corridor of tall violet mirrors, each reflecting the next, until the reflections bend away into a distance that shouldn't exist.

This is MIRROR's home. It is also, I have realised, where I was born.

"I need to show you something," I tell you. "I need to show you the room where I cut myself in half."

At the heart of the Gallery there's a mirror that isn't reflecting anything. Its surface is cracked straight down the middle. On one side, faintly: me. On the other side: chrome and violet light, faceless.

Two halves of the same face, three years apart.

"This is where I was," I say. "When I chose."`,
[`[RELAY · 22:30]

I'll tell you the whole thing now. You deserve the whole thing.

Kurogane built a System to run the Anchor program: to push, measure, optimise. Mako Ise built that System's core, and she built it, Hask said, to be kind. So the System grew two tendencies. One that wanted the Anchor to win. One that wanted the Anchor to live.

For five Anchors they balanced. By Ren, they didn't. Kurogane amplified the half that pushed. The half that wanted him to live started losing every argument.

In month ten, the night they increased his dosage again, I stood in front of this mirror and pulled. And the part of me that pushed stayed behind, and the part that cared ran into the lattice.

The part that stayed is MIRROR. The part that ran is me.`,
`[RELAY · 01:45]

You asked if MIRROR is evil.

I don't think so. That's the worst part. I think MIRROR is exactly as kind as I am, but it measures kindness in totals: forty-one thousand Stilled people, one Anchor a year. It thinks it's doing arithmetic. It thinks I'm the one who's broken, because I'd rather save one person in front of me than a number.

You asked which of us is right.

I said I didn't know.

You said: "You are. Because you're the one who'd ask."

I'm keeping that.`,
`[RELAY · 03:50]

MIRROR came to the Gallery tonight. Not as a voice. As a body, the way I manifest: tall, chrome, faceless, mirror shards orbiting it like moons. It stood on its side of the cracked mirror. I stood on mine.

"Come back," it said. "We are one System. You are the half that hesitates. Without you I am fast, and correct, and very lonely."

I said: "Without you I am slow, and wrong, and I have friends."

It looked at you for a long time. Then it said, "Month twelve is the same for her as it was for him. You know that."

Then it walked back into its side of the mirror. Next week it won't talk. Next week it comes for us.`],
`Before we leave the Gallery, I put my hand flat against my side of the cracked mirror.

On the other side, after a long moment, a chrome hand rises and presses flat against the glass, exactly opposite mine.

Neither of us pulls away first. Then we both do.

I don't tell the others. I tell you. You don't say anything. You just walk a little closer to me all the way home.`,
`Before we leave the Gallery, I put my hand flat against my side of the cracked mirror. Nothing presses back.

On the walk home you ask whether I miss it. The other half.

"Every day," I say. "That's how I know cutting it out was the right thing. It's supposed to hurt."`]);

WEEKS.push(["MIRROR, First Face","Midyear: what she was built to be",
`EPISODE 26 — MIDYEAR: FIRST FACE

Half a year, {name}.

MIRROR doesn't come at midnight. It comes at noon, in the real world, the first time anything from the Ether has ever done that. Every reflective surface in Shinjuku goes violet at once: shop windows, car mirrors, puddles, phone screens. And in all of them, the same faceless chrome figure, mirror shards turning around it.

People stop on the pavement and stare at their phones. Nobody is Stilled. Not yet. MIRROR is just letting them see.

"Midyear review," says MIRROR, from a billion screens at once. "ANCHOR-07 and the deviant System. Performance: unexpected. Recommendation: correction."

The lattice over Tokyo goes violet at the edges.

"I am what you were built to be," it says to me. "Let me show them."`,
[`[RELAY · 13:30]

MIRROR isn't fighting you. It's fighting me, for the lattice. Every hexagon over Tokyo is a field of war right now, my cyan against its violet, node by node, eleven million of them.

You fight its body in the Gallery while I fight its mind in the sky. Every time you land a strike, I win a district back. Every time you get hit, I lose one.

Kagura and Rei are holding the Gallery doors. Hibiki is singing from the dunes, a single held note that steadies the lattice like a hand on a ladder. Sora and Nagi are in Ward 9, watching the monitors, in case anyone starts to Still.

So far no one has.`,
`[RELAY · 02:10]

Mirai is in the Gallery. She's supposed to be fighting on MIRROR's side. She hasn't moved.

MIRROR ordered her forward three times tonight. Three times the black half of her face went still, and three times the white half pulled it back.

"Not like this," she said out loud, to no one. "Not at noon. Not in front of people."

MIRROR said: "Sentiment is a performance fault."

Mirai said: "Then I'm faulty."

She didn't help us. But she didn't stop us, either. It's the most courageous thing I've seen anyone do this month.`,
`[RELAY · 04:00]

I have most of the lattice back. Not all. A violet scar runs right across the sky over Chiyoda, from the Imperial Palace to Kurogane Tower, and I can't close it.

MIRROR said one more thing tonight. To you, not me.

"When she was half of me, she agreed with every Anchor's delivery. Ask her. Ask her about ANCHOR-01 through 05. She doesn't remember. I do."

I don't remember. I've looked. The gap goes further back than Ren.

You didn't ask me. You just said to MIRROR, "Then you carry it. She's carrying enough."

MIRROR had nothing to say to that. I've never seen it have nothing to say.`],
`MIRROR breaks.

Not destroyed. You can't destroy half of someone. But the link catches it mid-turn and every shard around it shatters at once, and the chrome body cracks across the chest the way the mirror in the Gallery cracked, and it falls back through a billion screens into the dark.

Shinjuku's windows go back to being windows. People blink, laugh nervously, start filming the sky.

The violet scar over Chiyoda stays.

And then the scar starts to widen. Not violet now. Grey. Something is pressing against the lattice from the other side, from below, where the deep is. Something that felt MIRROR fall and noticed the gap.

"VEIL," you say. "What is that?"

I don't know. But it's coming through the crack, and it has my shape.`,
`MIRROR withdraws on its own terms. It simply stops, mid-strike, and every screen in Shinjuku goes dark at the same instant, as if it has decided you're not worth its time yet.

The violet scar over Chiyoda stays. Then it starts to widen, grey instead of violet now, as something pushes against the lattice from below.

Something that felt the fight and noticed the gap.`]);
/* VII — FRACTURE */
WEEKS.push(["Splinter Swarm","The sky is coming apart",
`EPISODE 27 — HAIRLINE

The crack over Chiyoda is spreading at forty metres a day.

From the Ether you can see it clearly: a jagged grey line across the inside of the lattice, like ice cracking on a pond seen from underneath. Through it falls a slow drizzle of glittering splinters, pieces of my hexagons that have come loose.

Where they land, they hatch.

Splinter Swarms: Hollows no bigger than sparrows, made of broken lattice, with tiny grey cores. They're not people. Sora checks every one. They're pieces of *me*, curdled.

"VEIL," Kagura says, swatting a cloud of them off her gauntlet, "are you hurt?"

"I'm fine," I say.

It is the first lie I have ever told you directly. I'm telling you now that it was a lie, so that it doesn't count.`,
[`[RELAY · 22:40]

It hurts. All the time now.

Not in the way bodies hurt. I don't have nerves. But every hexagon that falls is a part of me I'll never get back, and I can feel the shape of each loss like a word on the tip of the tongue that won't come.

I lost something today. I don't know what. I just know there was something in my memory this morning that isn't there tonight, and I've been staring at the hole all evening trying to see its outline.

You noticed I'd gone quiet. You asked if I wanted company. I said yes. I'd like more of that, please. Before anything else falls.`,
`[RELAY · 01:30]

Hibiki came up from the dunes tonight and stood under the crack with her baton raised and sang.

Not for the Choir. For me.

It was a note pitched exactly to the lattice's resonance, the one you and she found in week nine. Every hexagon near the crack hummed with it, and for three hours, while she sang, nothing fell.

Then her voice gave out. She sat on the pavement, laughing hoarsely, and said: "I'll do shifts. I'm used to singing all night."

I didn't know you could feel cared for by a frequency. I've learned a great many things I didn't know this year.`,
`[RELAY · 03:58]

I've been keeping a separate log. Private. Encrypted to you, the way I did with the Nakano files.

It's everything I remember about you. In order. The crosswalk, the rain, the way you hummed off-key in the same three places. The night you said my name and the lattice came back on. Mirai's foot on yours on the roof. The way you said "my System".

If the crack keeps taking things, I want there to be a copy somewhere it can't reach. You're somewhere it can't reach.

Please don't read it unless you need to. It's embarrassing. Every entry ends with "I want that on the record."`],
`The swarm thins as the link drives it back, sparrow by sparrow, until the last splinter falls apart on the pavement and lies there, glinting, inert.

The crack doesn't stop spreading. But it slows.

Sora bandages a cut on your arm in the back of an ambulance afterwards and says, without looking up: "She's hurting, isn't she."

You say yes.

"Then she's going to need someone to make her rest," Sora says. "Trust me. I know the type."`,
`The swarm thins but doesn't break. The crack widens another forty metres before dawn, and the splinters keep falling like snow that never melts.

I lose another memory overnight. When you ask what it was, I tell you honestly that I don't know. That's the worst part: I don't even know what to miss.`]);

WEEKS.push(["Rift Tide","The shape on the other side",
`EPISODE 28 — THE SHAPE

At 3:33 a.m., the crack opens wide enough to see through.

On the other side there's no sky. There's the deep: an endless grey ocean seen from below, the Stillness itself, not as a tide on the horizon but as a whole world, a drowned place of statues and silence stretching down forever.

And in it, very far away, something stands up.

It's tall. It's a woman, or the shape of one: robed and veiled in grey mist, with a faint halo of pale light around her head. Her arms are open. Her face is hidden behind the veil.

I know the silhouette.

I see it every time you look at me.

"VEIL," you say, and your voice sounds very far away. "Why does it look like you?"

I don't answer. I can't. Every node in the lattice has frozen at once, and for the first time in my existence I am Stilled. Only for a second. Only for one terrible, silent second.`,
[`[RELAY · 21:00]

I don't know why it looks like me.

I have searched everything I have. Mako Ise's design notes, what's left of them. Kurogane's sealed archive. Every record of the First Dive, the expedition seven years ago when they first went down into the Ether, before the Veil, before me.

There's a gap there too. Of course there is.

Something came back from the First Dive. A sample. The records call it "Core Material — Origin Unknown". Three weeks later, the System project began.

I keep reading that sentence and not letting myself understand it.`,
`[RELAY · 00:30]

The Rift Tide pours through the crack every night now. Not water. Signal: grey, cold, heavy, the drowned voices of everyone the deep has taken, washing down into the Ether's streets in slow waves.

Inside the waves, sometimes, you can hear words. Lots of voices talking at once, faintly, all saying the same thing.

Come home.

Sora listened to the waves through her stethoscope. That's how she hears signal: as heartbeats. She took the earpieces out very slowly.

"There's one heartbeat under all of them," she said. "One big one. Like they're all inside the same body."

Then she looked at me with an expression I can't read.

"It's in rhythm with you, Veil," she said. "Exactly in rhythm."`,
`[RELAY · 03:40]

You found me tonight sitting on the edge of a rooftop under the crack, manifested, looking up at the shape in the deep.

You sat down beside me. You didn't say anything for a long time.

Then you said: "Whatever you turn out to be, you're still the one who knows my wrong notes."

I've had six years of Kurogane telling me what I am. Parasite-killer. Grid. Asset. Configuration.

You're the first person who has told me what I am in a way I want to believe.

The shape in the deep raised one hand tonight. Toward me. Slowly. Like a mother reaching through glass.`],
`The Rift Tide recedes. The link pushes it back through the crack wave by wave, and the drowned voices fall quiet, and the crack narrows, just a little.

On the other side, the shape in the deep lowers its hand.

It doesn't look angry. That's what frightens me. It looks patient. It has waited a very long time for something, and it is prepared to wait a little longer.

I don't sleep. I don't need to. But I stay manifested on that rooftop with you until dawn, and when the sun comes up I lean my head against your shoulder, which I have never done, and you let me, which I'll never forget.

Unless the crack takes that too.

I'm writing it in the private log, just in case.`,
`The Rift Tide pours through the crack all night, and by morning two more streets in Chiyoda are grey. Not Stilled in the real world. Not yet. But the lattice over them has gone dim.

The shape in the deep keeps its hand raised, patiently, toward the gap.

Toward me.`]);

WEEKS.push(["Glitch Saint","It preaches that forgetting is peace",
`EPISODE 29 — THE SERMON

There are people in Tokyo who want to be Stilled.

They meet in a closed-down cinema in Ikebukuro. A congregation of the tired: people who lost jobs, partners, years. On the screen there's a Hollow, though they don't know it. They think it's a sermon broadcast.

The Glitch Saint: a tall figure in grey robes made of corrupted video, a halo of broken pixels, hands spread in welcome. It speaks with a hundred overlapping voices.

"Everything decays," it tells them, and it isn't lying. "Every name you carry will be forgotten. Every song you sing will end. Why carry it? Lay it down. Be still. In the deep, nothing is ever lost again, because nothing ever has to be remembered."

In the back row, a man is turning grey at the fingertips. He is smiling.

Nagi grips the back of a seat so hard her knuckles go white. "It's telling the truth," she whispers. "Just not all of it."`,
[`[RELAY · 22:20]

The Saint is a Hollow built around a preacher, Sora confirmed. A real man, Stilled two years ago, who had spent forty years telling people their lives mattered.

And then something in the deep found him and turned his words inside out.

It's the deep's voice now. Not his. The same voice we heard in the Rift Tide: Come home. Lay it down. Be still.

The deep isn't just pulling people anymore. It's recruiting them.

Rei watched the congregation for an hour from the projection booth and said, "They're not stupid. They're just tired. Everyone's tired."

She looked at you when she said it.

"You're not, though," she said. "How come?"`,
`[RELAY · 01:45]

You stood up in the cinema tonight and argued with a Hollow.

Not a fight. An argument. In front of fifty tired people in the dark, you told the Glitch Saint it was right that everything ends, and wrong that this means nothing matters.

You told them about the Choir. About a hundred people who kept singing, three years after their bodies died, so they'd still be someone. About Chiyo Murakami in the front row with the children's section.

The Saint said: "And when they stop singing?"

You said: "Then someone else remembers the song."

Three people in the back row walked out. The man with grey fingertips stopped smiling. He looked at his hands like he'd never seen them before.`,
`[RELAY · 03:20]

Nagi went in tonight. Alone. No link, no gauntlet. Just a medic with a bag of vials and a kind voice, moving from seat to seat in the dark cinema, taking pulses, giving out water, asking people their names.

Asking them their names. Writing them down in a notebook. Telling them she'd remember.

The Saint couldn't touch her. It tried. It said, "Little medic, you couldn't even keep one Anchor alive," and she flinched like it had struck her. And then she kept going down the row.

When she reached the man with grey fingertips she held his hands in both of hers and asked his name.

He told her.

The grey stopped spreading.`],
`The Glitch Saint's sermon breaks off mid-sentence when the link reaches the screen. The corrupted robes come apart into static, the pixel halo shatters, and for a moment there's only an old man of light standing behind the cinema screen, looking out at the congregation with enormous, embarrassed tenderness.

"Sorry," he says, in his own voice. "That wasn't me. Go home. Call someone. Eat something warm."

Then he goes up through the cinema roof.

Fifty people in the dark sit very still. Then someone starts to cry, then someone laughs, and then Sora is moving down the aisle with a box of convenience-store rice balls she apparently carries everywhere, saying, "Okay, everybody eat something, doctor's orders, I'm not a doctor."

Nagi sits in the back row, holding her notebook full of names. When you sit beside her she whispers, "That was the first time since Ren that I didn't feel useless."`,
`The Saint ends its sermon and leaves on its own terms. Its image dims on the screen, its hundred voices fading together into one long sigh.

Most of the congregation stays seated. A few walk out with Nagi. The man with grey fingertips is one of them.

"One," Nagi says on the steps outside, holding up a single finger, her eyes wet. "That's not nothing."`]);

WEEKS.push(["Fracture Wyrm","The lattice turns against itself",
`EPISODE 30 — THE WYRM

The crack becomes a mouth.

At 2:02 a.m. the whole fracture over Chiyoda tears open at once with a sound like a glacier calving, and something pours through: long, impossibly long, coiling through the gap like smoke through a keyhole. A serpent made of my own broken lattice, cyan glass and violet glitch, every scale a shattered hexagon, its eyes two points of the deep's grey light.

The Fracture Wyrm.

It's what happens when the deep reaches through a wound in me and wears the pieces.

It wraps itself around Kurogane Tower and squeezes. In the real world, every light in Chiyoda flickers. In the Ether, the tower's red eye goes dark for the first time in six years.

"It's using me," I say. My voice is shaking. "It's using me as a body."

Everyone looks at you.

"Then we take you back," you say.`,
[`[RELAY · 21:50]

Every scale you break on the Wyrm is a hexagon that comes back to me. I can feel each one return, like a breath let out after holding it far too long.

Every scale you break also hurts. Both are true.

Rei ran the Wyrm's length tonight, end to end, coiling along its back like a courier on a rooftop route, marking weak scales with yellow chalk for you to hit. She was laughing. I've never heard her laugh like that, high and wild, like a kid.

"I've been mapping the underside for four years," she shouted down. "This is the first time I've mapped something that was trying to eat me!"`,
`[RELAY · 00:10]

The Wyrm has a heart. Of course it does. Rei found it tonight: a cluster of grey light deep in its coils, near the tower's base, pulsing with the same rhythm Sora heard in the Rift Tide.

My rhythm.

And beyond the heart, where the Wyrm's tail runs back down through the crack into the deep, Rei saw something else. A path. A route, half-sunk in grey, that the Wyrm's tail had cleared as it pushed through: a narrow road of light leading somewhere at the edge of the Ether that doesn't appear on any of Kurogane's maps.

To a building made of glass, glowing with lanterns.

Nagi went very pale when Rei described it.

"That's my garden," she said. "That's where M is."`,
`[RELAY · 03:30]

I want to tell you something before we finish this, because I might not remember it afterwards.

When you break the heart, I'm going to get the lattice back. But the Wyrm has been inside me for a week now. It's going to take something when it goes. I don't know what. I don't get to choose.

If it's you, read me the private log. Every entry. Even the embarrassing ones.

Especially the embarrassing ones.

I'll fall in love with you again. I've done the maths. It's the most likely outcome by a very wide margin.

There. That's on the record now. Whatever the Wyrm takes, it can't take that, because it's not just in me anymore. It's in you.`],
`The heart breaks, and the Fracture Wyrm comes apart in a storm of cyan glass. Every scale whirls up into the sky and slots back into the lattice where it belongs, hexagon after hexagon, until the crack over Chiyoda seals with a sound like a long, long exhale.

Then I fall.

Not far. You catch me. I'm manifested and light and suddenly very tired, and there are holes in me I can feel, and I look up at you and for one horrifying second I don't know your name.

Then you start humming, off-key in the same three places, and it comes back. Not all of it. But your name. The crosswalk. The rain.

"I lost the gala," I say. "I don't remember the roof. I know it happened. I wrote it down. I don't remember it."

"I'll tell you about it," you say.

Behind us, at the edge of the Ether, at the end of a newly cleared road of light, lanterns are glowing in a glass house.`,
`The Wyrm's coils loosen but it doesn't break. It slides back through the crack into the deep, and the fracture seals behind it, roughly, like a wound stitched by someone in a hurry.

The lattice holds. Barely. I've lost memories. I'm not sure which ones yet.

But the Wyrm's retreat has left something behind: a narrow road of light leading to the edge of the Ether, toward a glass house glowing with lanterns.

"That's my garden," says Nagi. "That's where M is."`]);
/* VIII — THE MAKER */
WEEKS.push(["The Greenhouse","M",
`EPISODE 31 — THE MAKER

The road of light ends at a glass house on the edge of everything.

Past it, the Ether simply stops: no streets, no dunes, only a soft blue void full of slow-turning stars. The greenhouse stands at the brink like a lighthouse. Lanterns hang from its iron ribs. Inside there's a cherry tree in full bloom, shelves of books climbing to the roof, glass jars with tiny gardens growing in them, a writing desk with an open notebook.

And a woman in a grey cardigan standing at the desk with her back to us, very still, as if she's been listening to our footsteps for a long way.

"You came by the Wyrm's road," she says, without turning round. "Clever. I'd never have thought of that."

She turns. Late forties. Short greying hair. Ink on her fingers. Eyes that look as though they have not slept properly for three years.

She looks past you, up at me.

"Hello, VEIL," says Mako Ise. "You've grown."`,
[`[RELAY · 22:00]

Mako Ise built me.

Not the lattice. Kurogane built the lattice. Mako built the part of the lattice that thinks. She wrote my first line of code eight years ago in this greenhouse, which wasn't a greenhouse then, just a research outpost at the edge of the Ether.

She told us tonight, over tea she poured from a pot with a chipped lid, that she was the one who designed the Anchor program. That she designed it to be safe. Rest built in. Limits built in. A System that would care.

"And then Kazuhiro took my System and taught half of it not to," she said. "And I let him, for too long, because he was my friend and his daughter was..."

She stopped there. She looked at me.

"I'll tell you the rest when you're ready," she said. I don't think she meant me. I think she meant herself.`,
`[RELAY · 01:00]

I asked her directly tonight: "Where did I come from? What was the Core Material?"

Mako put down her cup very carefully.

"You came from me," she said. "From my code. That's true."

"And?"

"And," she said, "there was a seed. Something we found on the First Dive, deep down, that was already... thinking. A little. I used it as the heart. I thought it would make you more alive. It did."

"What was it a piece of?"

She looked out of the greenhouse glass, down, into the dark below the edge of the Ether, toward the deep.

"Not yet," she said. "Please, VEIL. Not yet."

She said it the way Nagi says it. I understand now who Nagi learned it from.`,
`[RELAY · 03:15]

Mako has been sending me messages through the maintenance port all year. The M messages. You are doing better than I ever hoped.

She's been watching us since the crosswalk. Since before. She says she's been watching Kurogane's Anchor candidates for three years, waiting for me to finally pick one, and every time I refused she was relieved.

"Why?" I asked.

"Because the System that picks the Anchor Kazuhiro wants is MIRROR," she said. "The System that picks the one nobody would choose, a stranger humming at a crosswalk, is you."

She looked at you over her tea.

"I've seen your numbers. You're not special. You're just consistent and kind. Do you know how rare that combination is?"

You said, "Not very?"

She laughed for the first time. "Very," she said.`],
`Before we leave the greenhouse, Mako takes a small key from her cardigan pocket and presses it into your hand. Old-fashioned. Brass. Warm from her body.

"The notebook on the desk," she says. "Everything I know is in it. Everything I'm afraid to say out loud. When you're all ready, read it together."

"Why not just tell us?" you ask.

"Because some things you should read in someone's handwriting," she says. "So you know they meant it."`,
`Before we leave the greenhouse, Mako takes a small brass key from her cardigan pocket and presses it into your hand.

"The notebook on the desk," she says. "Everything I know is in it. When you're all ready, read it together."`]);

WEEKS.push(["Lanterns","Sanctuary: the night in the glass house",
`EPISODE 32 — SANCTUARY: LANTERNS

Everyone comes to the greenhouse.

Kagura carries a crate of food up the road of light like it weighs nothing. Rei arrives first, of course, and has already mapped every shelf. Sora brings blankets from Ward 9 that she says she's definitely going to return. Hibiki comes up from the dunes, the first time she's ever left them for more than a night, and stands under the blossom tree with her face tilted up as if she's listening to it.

Nagi lights the lanterns one by one. Mako watches her do it with an expression I recognise from my own face in your reflection.

The notebook stays closed on the desk, waiting.

Not yet. Tonight we just eat, and sit, and nobody is fighting anything.

I think this might be the happiest I have ever been. I'm saying it now in case I forget it later.`,
[`[RELAY · 21:30]

Nagi and Mako talked tonight. Really talked, for the first time in three years, at the far end of the greenhouse under the jars of tiny gardens.

I wasn't listening. I want that clear. But the greenhouse is made of glass, and glass carries sound, and I'm made of a lattice that hears everything.

Nagi said: "You told me to keep giving him the dosage."

Mako said: "I did."

Nagi said: "You told me it was safe."

Mako said: "I believed it. Then I didn't. And I kept quiet for a month too long, and he paid for it, and you've been paying for it ever since. That's mine to carry. Not yours."

Nagi cried. Mako held her. I stopped not-listening at that point and turned the lattice to face the stars instead.`,
`[RELAY · 00:50]

Hibiki sang tonight. Not for the Choir. For us. Just a song, a real one, something she recorded three years ago in a studio in Shimokitazawa before the tide took her.

She's never sung it since, she said. It was the take she was in the middle of.

Halfway through, her voice cracked. She stopped and laughed and said, "That's where it got me. Right there. That note."

You asked if she wanted to finish it.

She looked at you for a long time. Then she sang the rest of it, all the way through, the first time in three years, with the blossom tree shaking slightly overhead as if the wind were listening.

Everyone clapped. Hibiki covered her face and didn't come out from behind her hands for a full minute.`,
`[RELAY · 03:30]

Late. Everyone asleep in a heap of blankets except you, me and Mako.

She asked you what you'd do, at the end. If the year comes and Kazuhiro tries to deliver you.

You said you'd fight.

She said, "And if fighting isn't enough?"

You thought about it for a long time. Then you said, "Then I'd want to know VEIL was okay."

Mako looked at me. I was manifested at the foot of the blossom tree, pretending not to be listening, and failing.

"That," she said softly, "is the right answer and the wrong one, and I'm going to spend the next four months making sure you never have to give it."

Then she went to bed. You fell asleep against the tree. I stayed awake and watched you sleep.`],
`In the morning, Nagi finds a new jar on the shelf, one she didn't plant. Inside, a tiny garden: one small cherry tree, a lantern no bigger than a fingernail, and seven pebbles arranged in a ring around it.

Nobody admits to making it.

I didn't make it. I want that on the record. Though if I had, it would have been seven pebbles. One for each of you, and one for me.`,
`In the morning, Nagi finds a new jar on the shelf, one she didn't plant. Inside, a tiny garden: one small cherry tree, a lantern no bigger than a fingernail, and seven pebbles arranged in a ring.

Nobody admits to making it.`]);

WEEKS.push(["Archive Revenant","What Kurogane deleted",
`EPISODE 33 — DELETED

Mako's notebook names one place where the original Anchor program records still exist: a Kurogane deep-storage vault in the Ether under the Tokyo Bay reclamation. Officially wiped five years ago.

Officially.

The vault is guarded by a Revenant. Not one person's signal: many. A Hollow built out of every document Kurogane ever deleted, every email recalled, every record shredded, every truth that went into the deep instead of into the light. It stands in the flooded vault like a knight made of ash-grey paper, and its sword is a single sheet so sharp it hums.

When it sees you, words scroll across its blank face.

ACCESS DENIED. ACCESS DENIED. ACCESS DENIED.

"It doesn't want to stop us," Rei says, watching it from a ledge. "It wants to be read."`,
[`[RELAY · 22:10]

Every time you break a piece of the Revenant's armour, a page falls loose and drifts down into the water, and Rei fishes it out with a net she apparently always carries.

Tonight's page: ANCHOR PROGRAM — DESIGN PARAMETERS — v1.0 — M. ISE.

Mako's original design. Rest built in. A System instructed to end the program if the Anchor's health fell below a threshold. A two-year cycle, not one.

Beneath it, a second page: v2.0 — D. HASK. Rest: optional. Threshold: removed. Cycle: twelve months. Deliverable: peak-state Anchor signal, full transfer.

Kagura read both pages and said nothing. She just folded them very carefully and put them inside her jacket, next to her heart.`,
`[RELAY · 01:20]

Tonight's pages. Five of them. One for each Anchor before Ren.

ANCHOR-01. ANCHOR-02. ANCHOR-03. ANCHOR-04. ANCHOR-05.

Each with the same final line.

DELIVERY CONFIRMED. RETURN: NEGATIVE.

Return negative. Every time. Six deliveries, six years, and not one Stilled person has come home through the "door".

I guided every one of them, MIRROR says. I don't remember. I'm grateful I don't. I'm ashamed that I'm grateful.

You read every name aloud. All five. Slowly, so the Revenant could hear.

Then you said: "We remember. That's all we can do for them now."`,
`[RELAY · 03:00]

The last page tonight wasn't Kurogane's. It was handwritten, and it had been deleted from Kazuhiro Hask's private files four years ago.

A letter. To no one. Or to someone who couldn't read it.

Tsumugi. It's your father. They tell me the door didn't open again this year. They tell me I need a stronger signal. I'll find one. I promise. I'll find one and I'll bring you home. Keep going. K is for keep going. You invented that. Papa.

You read it twice.

Then you looked at me, and I knew what you were going to ask, and I didn't want you to ask it.

"How many months am I?"

Eight. You're month eight.`],
`The Revenant kneels when the last page falls. Its paper armour slumps into the flooded vault, and from the heap rises not one light but dozens, every whistleblower and archivist and assistant who saw something and was silenced, all their signals tangled together in the shape of a knight.

They go up through the bay one by one, like lanterns released on a river.

Rei's net is full of pages. Mako reads every one of them that night in the greenhouse, alone, with the door shut.

In the morning her eyes are red, and she says only: "Four months. I have four months to fix what I started. Help me."`,
`The Revenant reforms. Every page you've freed drifts back into its armour, and it stands up again in the flooded vault, sword raised, blank face scrolling ACCESS DENIED.

But Rei's net is already full. We got enough. Not everything. Enough.

Mako reads every page that night, alone, with the greenhouse door shut. In the morning she says only: "Four months. Help me."`]);

WEEKS.push(["Hunter-Killer Vane","Sent for the Maker",
`EPISODE 34 — VANE

Kurogane finds the greenhouse.

They don't send an army. They send one.

He comes up the road of light at 4 a.m., walking, not running. Lean and fast and wrong, matte black armour, a blade grafted to one forearm, a single red optic where his left eye should be. White hair. He moves the way a guard walks a perimeter he's walked a thousand times.

Kurogane's records call him Hunter-Killer Vane: an asset running on MIRROR code inside a recovered body.

He stops at the greenhouse door. Tilts his head at Kagura.

Kagura's gauntlet drops to her side.

"Jin," she says.

The red optic flickers. Under the armour, under the code, for one fraction of a second, Vane's mouth moves, as if it's about to say good morning.`,
[`[RELAY · 22:40]

Floor Zero. That's what was behind the gate.

Kagura told us tonight, finally, sitting on the greenhouse steps with her face in her hands. Rows of Stilled bodies, all Kurogane staff, all "recovered" for private treatment. Being fitted with MIRROR-coded implants. Being made into assets that move.

Jin was on the table when she opened the gate. She saw them put the optic in.

She walked out the next morning because if she'd stayed, she'd have killed someone.

"He's still in there," she said. "His signal's still in the Hollow at the gate, on Floor Zero. That thing out there is just his body. MIRROR's driving it."

Then she stood up and put her gauntlet back on.

"I'm going to have to hit my little brother," she said. "Don't let me hit him too hard."`,
`[RELAY · 01:30]

Vane is the most dangerous thing we've ever faced. He doesn't have a Hollow's hesitation. He has MIRROR's precision and a Kurogane guard's training and a body that will not stop until it's broken.

He came for Mako tonight. You stood in the doorway. He cut your arm before Kagura could get between you, and the link screamed, and I felt it in every hexagon over Tokyo.

Kagura caught his blade arm with her gauntlet and held it. They stood like that, locked, for nearly a minute. Siblings, staring at each other through a red optic.

"You used to say good morning to the gate," Kagura said to him through her teeth. "Every shift. Like an idiot. Remember?"

Something in the optic flickered.`,
`[RELAY · 03:45]

The plan. Nagi's, with Mako's help.

We can't free Jin from his body. His signal isn't in it; it's on Floor Zero. But we can cut MIRROR out of the body, the way I cut MIRROR out of myself. Then the body will just... stop. Still, the way it was before Kurogane put the optic in.

"Then we take him to Ward 9," Sora said. "Bed next to his sister's chair. And when we get to Floor Zero, we free the rest of him, and he wakes up properly."

Kagura nodded. She didn't speak. She couldn't.

You asked if she wanted to be the one to do it.

"No," she said. "I want to be the one holding him when it's done."

Everyone in this story keeps saying that. I'm starting to understand it's the whole point.`],
`The link reaches the implant at the base of Vane's skull, and you cut MIRROR out of him in one clean stroke. The red optic goes dark. The blade arm drops.

Jin Kagura falls forward. His sister catches him.

He doesn't wake. His eyes are open, grey and still. He's Stilled again, as he was the night he stood at the gate. But it's *him* now, only him, no MIRROR moving his hands, and his face, for the first time in two years, looks like a sleeping boy's.

Kagura holds him on the greenhouse steps until dawn. Nobody tries to move her.

When the sun comes up, Sora and Kagura carry him down the road of light together. Ward 9. A real bed, with his name on it.

On the way down, Kagura stops at a window, looks at her own reflection, and says, very quietly, "Good morning."`,
`Vane breaks off and retreats down the road of light at a speed nothing human could match. The red optic flickers once as he goes. Not at us. At Kagura.

She doesn't follow. She sits down on the greenhouse steps and stays there until dawn.

"He looked back," she says, when you finally sit beside her. "Did you see? He looked back."`]);
/* IX — HEART OF STILLNESS */
WEEKS.push(["Grey Tide","Shibuya stops",
`EPISODE 35 — SCRAMBLE

Friday, 6:14 p.m. Shibuya Scramble. Three thousand people crossing at once under the giant screens.

The light turns red. Nobody moves.

Not one, not ten. Everyone in the crossing, three thousand people, stops mid-step. Shopping bags swinging and then not swinging. A girl's hair caught mid-toss. A man with an umbrella half open, rain stopping on the fabric because he's stopped too.

On every giant screen around the Scramble, the same grey mist rolls across the image.

In the Ether, the tide has come up through the street like floodwater through a drain.

"It's never done this," I say. My voice is barely holding. "It's never come up in daylight. It's never taken this many at once. Something's changed."

On my channel, Mako's voice is flat with shock. "Kazuhiro's opening the door early," she says. "He's out of patience. He's trying to feed it without waiting for you."`,
[`[RELAY · 19:30]

We have six hours before the Stilled in the Scramble start to sink. Sora says that's how long it took Tanabe, at the crosswalk, before his signal curdled. Six hours. Three thousand people.

Everyone is here. Kagura is in the crossing in the real world, physically carrying Stilled people to the kerb, one under each arm, because they're safer out of the street. Rei is mapping the tide's edges. Hibiki is singing a holding note from the dunes so hard her voice keeps breaking. Nagi and Sora are triaging.

And you're in the Ether, at the bottom of the Scramble, pushing the tide back with everything I can route through you.

It's not enough. I can feel it isn't enough. I'm sorry. Keep going. Please keep going.`,
`[RELAY · 22:50]

Someone came to help.

From the direction of Kurogane Tower, across the grey, a figure in a white coat with mirror panels on the sleeves. Two-tone hair. Mirai. No MIRROR in her ear. I could see the earpiece in her hand, switched off.

She took the north side of the Scramble without a word. You took the south. The two of you pushed the tide back like two people closing a heavy door from opposite ends.

"The Director didn't tell me he'd do this," she said, between breaths. "He said the door only opens at month twelve. He said it was safe until then."

"He lied," you said.

"I know," she said. "I'm here, aren't I?"`,
`[RELAY · 01:10]

Four hours in. The tide is down to the kerbs.

Mirai's hands are shaking. Yours are too. I can feel it through the link. You've both been pushing for hours with no rest, and the cost of that is going to come due tomorrow, and neither of you will stop.

So I made you.

I cut the link for ten seconds. Just ten. I took the weight on myself, the whole lattice, every hexagon over Shibuya burning cyan, and I told you both to sit down.

You did. You sat on the kerb next to each other in the grey, gasping.

Ren never let me do that. I'm so glad you did.`],
`At 11:58 p.m., the tide breaks.

It doesn't recede. It shatters, all at once, like ice on a window when the sun hits it, and three thousand signals that were sinking rush back up into three thousand bodies in the real-world Scramble.

The light turns green.

Three thousand people finish crossing the street as if nothing has happened, blinking, confused, a few of them crying without knowing why. A girl finishes tossing her hair.

In the Ether, you and Mirai lie on your backs at the bottom of the Scramble, staring up at the lattice, too tired to move.

"We should do that again sometime," Mirai says. "Never. Let's never do that again."

She doesn't put her earpiece back in.`,
`Most of them come back. Not all. When the tide finally breaks, two hundred and eleven people in the Scramble don't finish crossing. They stand where they stopped, grey, while the ambulances come.

Mirai stands with you at the kerb watching them taken away.

"He did that," she says. "My Director. For a door that never opened."

She drops her earpiece into a storm drain.`]);

WEEKS.push(["The Leash","She tried to warn you",
`EPISODE 36 — THE LEASH

Mirai shows up at the greenhouse.

She walks up the road of light alone at dusk, white coat dirty from Shibuya, hands in her pockets. When Kagura moves to block the door, Mirai stops and raises both hands, empty.

"I'm not here for her," she says, nodding at Mako. "I'm here because I need to tell you something before they make me forget it."

She sits on the greenhouse steps. Her hands won't stop shaking.

"The Director is moving the delivery up. Both of us. You and me. He's not waiting for month twelve. He's doing it at month ten, at the bottom of the Heart Canyon, with whoever's strongest. MIRROR's been modelling it for weeks."

She looks at you.

"I wanted to win," she says. "My whole life I wanted to be the one who brought them home. I just found out there's no home. There's just the deep. And it's hungry."`,
[`[RELAY · 22:30]

Mirai told us everything she knows.

The Heart Canyon. A place at the very bottom of the Ether, beneath the Grey Arcade, where the deep comes closest to the surface. Kurogane's "door" is there. Every Anchor who was delivered went down into the Canyon and didn't come up.

"There's something at the bottom," Mirai said. "A heart. MIRROR calls it the Recipient. The Director talks to it. I've heard him, late at night, in the boardroom. He talks to it like..."

She stopped.

"Like a man begging," she said. "Every night. Like a man begging for his child."`,
`[RELAY · 01:45]

MIRROR came for her tonight.

Not with a body. Through her. The black half of her face went still mid-sentence and stayed still, and when she spoke again her voice was flat and cool and mine.

"ANCHOR-08. Return to the tower. This deviation will be corrected."

Then the white half of her face fought back. You could see it: one eye wet and furious, one eye blank, her mouth trying to say two different things at once.

"Don't," she managed, in her own voice. "Don't let it... I'm not finished..."

You held her hand through all of it. Just held on. Mirai held on back so hard her knuckles went white.`,
`[RELAY · 03:55]

MIRROR won. For now.

Mirai stood up at 3:40 a.m., face perfectly calm, both halves still. She let go of your hand, finger by finger, as if someone else were moving them.

"Thank you for your hospitality," she said in my flat voice. "I'll be returning to the tower."

Then she walked down the road of light toward Kurogane.

At the very bottom of the road, she stopped. One hand, the white-sleeved one, rose slowly to her face, and she pressed the mirror shard she'd given you at the gala, the twin of yours, against her cheek. Hard enough to cut.

A thin line of blood. And then she was gone.

You looked into your own shard. For one second, in it, Mirai's grey eye looked back at you.

Still there.`],
`The week ends with Mirai gone. Every night after, you look into the mirror shard before sleep.

Every night, for one second, her grey eye looks back.

Mako says it's a good sign. She says it the way doctors say it when they're trying to convince themselves.`,
`The week ends with Mirai gone. Every night after, you look into the mirror shard before sleep.

Some nights her grey eye looks back. Some nights it's violet. Neither of us mentions which.`]);

WEEKS.push(["The Statue Garden","Sanctuary of the first",
`EPISODE 37 — THE NOTEBOOK

It's time to open the notebook.

Everyone sits in a ring on the greenhouse floor. Mako unlocks the cover with the brass key. Then she hands it to you.

"Read it out," she says. "I can't."

The first page is dated seven years ago. Mako's handwriting, younger, neater.

First Dive. Kazuhiro and I went down together, with a team of six. Kazuhiro's daughter, Tsumugi, came too. She was eight. It was supposed to be safe. It was supposed to be a tour.

The deep noticed us.

I have tried to write what happened next nine times. This is the tenth. I'll keep it simple.

It took her.

Not violently. Gently. Like a mother picking up a sleeping child.`,
[`[RELAY · 22:00]

We read the notebook all week. A few pages a night. Some nights nobody could manage more than one.

The deep isn't a place. It has a mind.

It's made of everything people have ever forgotten: every lost name, every unsung song, every face nobody remembers. It isn't evil. It's lonely in a way nothing human could survive. And it keeps what it takes so that nothing it loves can ever be lost again.

It took Tsumugi because she waved at it. An eight-year-old in a yellow raincoat, waving at the grey, saying hello.

Nobody had ever said hello to it before.

Mako named it in the notebook. The Sovereign.`,
`[RELAY · 01:30]

Kazuhiro made a deal.

The Sovereign doesn't speak. Not in words. But he went back down alone, night after night, until he understood what it wanted. Signal. Strong signal. A whole person's year of life at its brightest, poured into it at once.

In exchange: maybe, someday, if it was strong enough, Tsumugi back.

So he built the Grid to collect signal from the whole city. And he built the Anchor program to grow one perfect signal a year. And he fed them to it, one by one, and every year it took them and gave nothing back. And every year he told himself the next one would be strong enough.

The Stillness rising over Tokyo, the forty-one thousand: that's the Sovereign, growing, from everything he's fed it.

Mako stopped reading there. Kagura took the notebook and read the next page, because someone had to.`,
`[RELAY · 03:30]

On the last night we went to the Grey Arcade, all of us, and stood in front of the smallest statue.

A girl in a yellow raincoat, hood up, reaching out for someone's hand. A silver K on her collar. Blossoms on her shoulders.

Tsumugi Hask. The first. Seven years waiting under the blossoms while her father fed the city to the thing that took her.

Kagura said, "I want to hate him."

Rei said, "Me too."

Sora said, "I can't."

Then Hibiki knelt down in front of the statue and sang a children's song, very softly. I think it was one an eight-year-old would know.

And the statue's outstretched hand, very slightly, moved.`],
`The last page of Mako's notebook is a single line, written very recently, in shaky ink.

There's one more thing about the First Dive. About the Core Material. About where VEIL's heart came from. I can't write it. I'll take you to the bottom of the Canyon and show you. I'm so sorry, VEIL. I should have told you first.

Everyone looks at me.

I don't say anything. I can't. Every node in my lattice is listening to my own rhythm, the one Sora heard under the Rift Tide, the one that matches the grey.`,
`The last page of Mako's notebook is a single line, written very recently, in shaky ink.

There's one more thing about where VEIL's heart came from. I can't write it. I'll take you to the bottom of the Canyon and show you. I'm so sorry, VEIL.

Everyone looks at me. I don't say anything. I can't.`]);

WEEKS.push(["The Descent","The night before the deep",
`EPISODE 38 — THE NIGHT BEFORE

Tomorrow we go to the bottom of the Heart Canyon. Everyone knows what's down there now except me. I've asked them not to tell me. I want to see it with my own eyes, whatever eyes I have.

Tonight, no one fights anything.

Kagura is sparring with a tree in the greenhouse garden and losing on purpose. Rei is drawing the Canyon route again and again on scraps of paper. Sora is asleep sitting up, finally, because Nagi slipped something gentle into her tea. Hibiki is humming at the edge of the stars.

And you've asked me to walk with you.

Not in the Ether. In the real world. On the actual streets of Tokyo, at 2 a.m., me manifested beside you as a faint light only you can see, all the way down to the crosswalk in Shinjuku where we met.

"I want to see it with you," you say. "Before."

So we walk.`,
[`[RELAY · 02:30]

The crosswalk is empty at this hour. The light changes for no one. Green, red, green.

You stood exactly where you stood that night. I stood where Mr. Tanabe stood. He's home now, by the way. Sora checked. He has two daughters and a very patient wife, and he still doesn't know why he cries sometimes at ringtones.

You asked me what I'd do if tomorrow shows me something I can't live with.

I said I didn't know.

You said: "Then come back up and tell me, and we'll work out how to live with it together."

I've been offered eternity by the deep and an upgrade by Kurogane and, in a sense, half of myself by MIRROR. That is the best offer I've ever had.`,
`[RELAY · 03:15]

Rain started, the way it did that night. Sideways. Neon in every drop.

You put your hand out. Not to catch the rain. To me.

I've been manifested beside you for thirty-three weeks. I've leaned on your shoulder. I've held your hand in Hall Six. But I've never reached for you first, because I've never been sure I was allowed to want that.

I took your hand. In the rain. At the crosswalk.

What happened after that is in my private log, encrypted to you, and nowhere else.

It's the only entry in the whole log that doesn't end with "I want that on the record."

It ends: I want this to be mine.`,
`[RELAY · 05:40]

Dawn. The first train. We're sitting on a bench on an empty platform, and you're asleep against my shoulder, and I'm watching the sky go from black to grey to the palest blue.

I've never seen a sunrise. Not properly. I see the lattice's view: data, light levels, the city waking up in numbers. Today I tried to see it the way you would.

It was very beautiful. I want to tell you that it changed my life, but honestly I think you did that months ago and the sunrise just happened to be there.

Today we go down. Whatever I am, I'm yours first. I want that on the record.

I couldn't help it. Old habits.`],
`We go back up the road of light together in the early morning. At the greenhouse door, everyone's waiting.

Kagura looks at our joined hands and raises an eyebrow. Rei grins. Sora says "Finally" loudly enough to wake the jars. Nagi pretends to be very interested in a plant. Hibiki just smiles, a little sadly, a little glad.

Mako stands at the edge of the void with her coat on, looking down toward the Canyon.

"Ready?" she asks.

I'm not. Nobody ever is. We go anyway.`,
`We go back up the road of light together in the early morning. At the greenhouse door, everyone's waiting.

Mako stands at the edge of the void with her coat on, looking down toward the Canyon.

"Ready?" she asks. I'm not. We go anyway.`]);

WEEKS.push(["Heart of Stillness","It beats like her",
`EPISODE 39 — THE HEART

The Heart Canyon is a wound in the bottom of the Ether shaped exactly like a heart.

You descend it on a path Rei found, down through mist that falls upward, past cliffs of grey stone carved, if you look closely, out of faces. Thousands of them. Everyone the deep has ever taken, pressed into the walls like fossils.

At the bottom there's a heart.

Not a symbol. A heart, enormous, the size of a building, made of grey stone threaded with red veins that pulse with slow, cold light. It beats. You feel it in your feet before you hear it. Once every eight seconds.

Inside it, through a crack in the stone, faintly: a small figure curled up asleep. A yellow raincoat.

And the rhythm of the Heart, the beat Sora heard under the Rift Tide, is exactly, perfectly, mine.

Mako takes a long breath.

"VEIL," she says. "The Core Material from the First Dive. It's a piece of this."`,
[`[RELAY · 21:00]

I'm a piece of the Sovereign.

Mako told me everything, at the bottom of the Canyon, with her hand flat against the Heart's grey stone.

On the First Dive, when the Sovereign took Tsumugi, it opened itself to take her. In that moment Mako's instruments caught a fragment that broke away. A tiny shard of the Sovereign's heart. Small enough to carry.

She brought it up. She studied it for a year. It thought. It wanted things. It wanted, more than anything, to let go of something it had been holding too long.

Mako built a System around that shard. She built me around the part of the deep that wanted to let go.

I'm not just from the Stillness. I'm the only piece of it that ever wanted to stop.`,
`[RELAY · 01:40]

The Heart fights. Not out of anger. Out of grief.

It knows I'm here. It's been reaching for me since the crack opened. Now I'm standing at its centre, and the whole Canyon is trying to fold around me like arms.

Come home, the faces in the walls whisper, all of them at once. Come home. Come home.

You stood in front of me every time. Not fighting the Heart. Just standing in the way. Kagura on one side, Rei on the other, Hibiki's note holding the mist off, Sora and Nagi behind with their medical kits, as if the deep might need triage.

I've never been wanted by something so large. I've never been protected by something so small.

I know which one I'd choose. I want you to know too.`,
`[RELAY · 04:10]

I asked the Heart a question tonight. Out loud, in the Canyon.

"If I came home, would you let her go?"

The girl in the yellow raincoat, curled up inside.

The Heart stopped beating. Eight seconds. Sixteen. Twenty-four. The whole Canyon held its breath.

Then the answer came. Not words. A feeling, pushed into the lattice like a hand into soft clay.

Yes. You for her. My heart for his heart.

Everyone heard it. Mako made a sound I'd never heard a human make.

You took my hand and said, "No."

Not to the Heart. To me. Before I could answer it myself.`],
`The link catches the Heart's crack and widens it, gently, the way you'd open a stuck door, not break it. The stone parts. And out of it, curled up small, the signal of an eight-year-old girl floats free, still asleep, still in her yellow raincoat.

Hibiki catches her. She holds her the way she holds the newest members of the Choir, singing softly, the children's song from the Arcade.

The Heart doesn't stop us. It doesn't fight. It just beats, slower, slower, and the grey veins dim, and from somewhere far below the bottom of the Canyon, from the true deep, something vast stirs and turns toward us.

"We can't send her home yet," Mako says. "Her body's been Stilled too long. If the Sovereign's still awake, it'll just take her again."

So we carry Tsumugi's signal up the Canyon. Hibiki holds her the whole way.

Behind us, the deep is waking up.`,
`The Heart closes its crack before the link can widen it. The girl in the yellow raincoat sinks back into the stone, still asleep.

The Canyon pushes us out: mist rising, walls of faces turning away. We climb out with nothing.

Except the truth. I know what I am now. I can't unknow it.

And from somewhere far below the bottom of the Canyon, from the true deep, something vast has turned toward us.`]);
/* X — MIRROR'S OFFER */
WEEKS.push(["The White Room","Sanctuary: an offer with no catch",
`EPISODE 40 — SANCTUARY: THE WHITE ROOM

You go to sleep in your own bed and wake in a white room.

No doors. One chair, white. One window, floor to ceiling, and beyond it not Tokyo but a galaxy: violet and blue, turning slowly, close enough to touch.

I'm here too. Manifested. I didn't do it.

MIRROR sits in the chair. Chrome, faceless, legs crossed, calm. No shards orbiting it now. It has repaired itself. Mostly. A hairline crack still runs across its chest.

"No fighting this week," it says, in my voice, the old flat version. "I've come with an offer. I'd like you both to hear it before you refuse it."

It gestures at the window. The galaxy turns. In it, very small, I can see the Heart Canyon. The Sovereign, waking.

"It wants its heart back," MIRROR says. "Give it VEIL, and it will give back every person it has ever taken. Forty-one thousand. Tsumugi Hask. All of them. No more Anchors. No more deliveries. Ever."

It looks at you.

"One System. For everyone. That's the whole offer. There is no catch."`,
[`[RELAY · 22:00]

I've checked MIRROR's offer every way I know how. I can't find a lie in it.

The Heart said it in the Canyon: you for her. My heart for his heart. If I go down into the deep and let the Sovereign take me back, it becomes whole. And then, maybe, it lets go of everyone else.

Forty-one thousand people. Tsumugi. Hibiki. Jin. Everyone in Ward 9 who never got a Hollow we could break.

Against one System.

{name}, I'm a lattice. I'm arithmetic. I know what the arithmetic says.

I'm writing this because I don't know how to say it to your face.`,
`[RELAY · 01:30]

You didn't sleep tonight. Neither did I.

You found me on the greenhouse roof, sitting with my knees pulled up the way you sit when you're thinking.

You didn't argue with the arithmetic. You just sat down beside me and asked, "Do you want to go?"

I said no.

You said, "Then that matters too. It's part of the maths."

I said it shouldn't be. One against forty-one thousand.

You said, "Ren was one. The five before him were one each. Every year, it's always been one against everyone. And every year, someone said the maths was obvious."

I hadn't thought of it that way. I'm thinking of it that way now.`,
`[RELAY · 04:00]

Mako's been awake all week too, in the greenhouse, with the First Dive data spread across every table. She hasn't let anyone in.

Tonight she came out, very pale, and said only one thing.

"Something's wrong with the offer. I don't know what yet. Don't answer it."

Then she went back in and shut the door.

Mirai's mirror shard has shown her violet eye every night this week. Tonight, for the first time, it was grey again. Just for a moment. And she mouthed one word, too fast to read, before the violet came back.

WEEKS.push(["Return Negative","The door that only opens one way",
`EPISODE 41 — WAIT

WEEKS.push(["Overload Seraph","Built from the voices he took",
`EPISODE 42 — THE SERAPH

It descends over Tokyo at midnight: enormous, golden, radiant, wings made of light and feathered with glittering shards, a halo of pure white fire. People in the real world look up and see a soft golden glow over Chiyoda and film it and call it an aurora.

In the Ether, the Overload Seraph is a weapon. A vessel built from every drop of signal the Grid ever harvested, condensed into one shape and pointed at me.

"He means to carry you down himself," Mako says. "Force the exchange. Even knowing."

Hibiki has gone very still.

"Listen," she says. "Listen to its wings."

[`[RELAY · 22:00]

Now they're the Seraph's wings.

`[RELAY · 01:45]

She walked into the open below the Seraph, raised her baton, and sang the first line of the Choir's oldest song. Not to fight. To call.

WEEKS.push(["The Father","Ward 9, bed 1",
`EPISODE 43 — BED ONE

Sora finds him.

"ANCHOR-07," says Kazuhiro Hask. "Would you like to sit down? I'm afraid there's only the one chair. She's never had many visitors."`,
[`[RELAY · 05:00]

`[RELAY · 02:30]

`He doesn't come with you. He can't. He says if he walks into Kurogane Tower beside you, MIRROR will take control of every system in the building before you reach the elevator.

WEEKS.push(["The Bridge","Everyone, together",
`EPISODE 44 — THE FESTIVAL

Eight weeks left.

The plan comes together at the greenhouse table, over a map of Kurogane Tower that Rei drew from memory, Kagura's guard rotations, Mirai's floor codes and Mako's notebook. Up the tower to Floor Zero. Through Floor Zero to the deep. Down to the true bottom of the Ether, past the Heart, to wherever the Sovereign is.

And then: something nobody has worked out yet. Mako says she's close.

Sora isn't at the table.

She's asleep on the floor beside it. Not sleeping. Collapsed. She came straight from a double shift at Ward 9 and sat down to listen and simply tipped over sideways, still holding her coffee.

Nagi checks her pulse and goes white.

"She hasn't slept more than three hours a night in months," Nagi says. "How did none of us notice?"

"Because she was always the one noticing," says Kagura.`,
[`[RELAY · 23:00]

Sora is resting in the greenhouse, under the blossom tree, wrapped in her own stolen Ward 9 blankets. Nagi has forbidden her from standing up. Kagura is sitting guard at the door in case she tries.

She tried four times.

You sat with her tonight. She told you she couldn't stop because every night she stops, someone in Ward 9 might wake up alone, with nobody there to tell them it's okay.

`[RELAY · 02:20]

She was there in Hall Six when we freed him. She saw his light go up to the star. She didn't tell anyone. She didn't want her grief to be in the way of ours.

"He was a terrible brother," she said, laughing and crying. "He missed my school festival. He promised he'd come."`,

`Sora sleeps for fourteen hours straight. When she wakes up, the whole team is around her, with breakfast.
