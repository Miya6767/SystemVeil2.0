 openSheet(`<h2>Today's quest</h2><p class="small muted">Shift your schedule when life happens. Default for ${DAYS[weekday(t)]}: <b>${TYPE_LABEL[store.settings.schedule[weekday(t)]]}</b>.</p><div class="stack">${[['','Follow schedule'],['gym','Gym training'],['bw','Bodyweight session'],['rest','Recovery day']].map(([k,n])=>`<button data-act="settype" data-k="${k}" class="${cur===k?'pri':''}">${n}</button>`).join('')}</div><h3>Rest pass</h3><p class="small muted">Sick, injured or travelling? A rest pass protects your streak and HP for today.</p><button data-act="pause" class="${d.pause?'pri':''}" style="width:100%">${d.pause?'Rest pass ON (tap to remove)':'Use a rest pass today'}</button>`)}
function downloadFile(name,txt,type){try{const url=URL.createObjectURL(new Blob([txt],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return true}catch(e){toast('Download blocked. Use Copy.');return false}}
function markBackup(){store.meta.lastBackup=todayStr();save();if(tab==='system')render()}
const backupText=()=>JSON.stringify(Object.assign({},store,{exportedAt:new Date().toISOString(),app:'system-veil'}));
function exportCSV(){const q=v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v;const rows=[['date','type','item','detail','set','kg','reps_or_value']];
 [...store.sessions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{s.entries.forEach(e=>{const x=EX[e.exId]||{en:e.exId,ja:''};e.sets.forEach((st,j)=>rows.push([s.date,typeName(s.type),x.en,x.ja,j+1,st.w,st.r]))});(s.cardio||[]).forEach(c=>rows.push([s.date,'Cardio',c.m,'','','',c.min]))});
 Object.keys(store.days).sort().forEach(d=>{const x=store.days[d];if(num(x.vocal&&x.vocal.min))rows.push([d,'Quest','Vocal training','min','','',x.vocal.min]);if(x.creatine)rows.push([d,'Quest','Creatine','','','',1]);if(x.vitamins)rows.push([d,'Quest','Vitamins','','','',1]);if(x.protein)rows.push([d,'Quest','Protein','g','','',num(x.protein.g)]);(x.cardio||[]).forEach(c=>rows.push([d,'Cardio',c.m,'','','',c.min]))});
 downloadFile(`system-veil-${todayStr()}.csv`,'﻿'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv')}
function handleImport(txt){let o;try{o=JSON.parse(txt)}catch(e){toast('Not a valid backup.');return}if(!o||!Array.isArray(o.sessions)){toast('Backup not recognized.');return}
 const isSV=o.app==='system-veil'||o.profile;
 confirmSheet(isSV?`Replace ALL current data with this System Veil backup (${o.sessions.length} sessions)?`:`Import ${o.sessions.length} sessions from a Lean Build backup? Your current workout log is replaced; quests, profile and story are kept.`,'Import',()=>{
  if(isSV){store=migrate(o)}else{store.sessions=o.sessions;store.bw=o.bw||store.bw;store.startDate=o.startDate||store.startDate}
  save();recompute();if(G){store.meta.seenL=G.lv.L;store.meta.seenR=G.rank.r;store.meta.seenB=Object.keys(G.earned);store.meta.seenStory=G.story.map(s=>s.id)}save();tab='quests';render();toast('Restored ✓')},true)}

document.addEventListener('click',async ev=>{
 const b=ev.target.closest('[data-act]');if(!b)return;unlockAudio();
 const a=b.dataset.act,d=store.draft,i=+b.dataset.i,s=+b.dataset.s,t=todayStr();
 switch(a){
  case 'popok':nextPopup();break;
  case 'gostory':Q.length=0;nextPopup();tab='story';render();scrollTo(0,0);break;
  case 'tab':tab=b.dataset.tab;render();scrollTo(0,0);break;
  case 'statseg':statSeg=b.dataset.s;render();break;
  case 'recseg':recSeg=b.dataset.s;render();break;
  case 'awk':awk.step=+b.dataset.s;render();runTyped();scrollTo(0,0);break;
  case 'awkprof':{const n=$('#aname').value.trim(),hc=num($('#aheight').value),wv=num($('#aweight').value),un=$('#aunit').value,vy=num($('#avox').value);
   if(!n||!(hc>100&&hc<250)||!(wv>25)){toast('Enter a name, height (cm) and weight.');return}
   awk.f={...awk.f,name:n,h:hc,w:wv,unit:un,vy,kg:un==='lb'?wv*LB:wv};store.settings.bwUnit=un;awk.step=PROLOGUE.length+2;render();scrollTo(0,0);break}
  case 'awktrial':{const f=awk.f,t0=todayStr();const skip=!!b.dataset.skip;
   store.profile={name:f.name,heightCm:f.h,kg:r2(f.kg),vocalYears:f.vy,awakenedOn:t0,title:''};
   if(!skip)store.trials.push({date:t0,pushups:num($('#tpush').value),plank:num($('#tplank').value),squats:num($('#tsquat').value),kg:r2(f.kg)});
   store.bw=store.bw.filter(x=>x.date!==t0);store.bw.push({date:t0,kg:r2(f.kg)});
   recompute();store.meta.seenL=G.lv.L;store.meta.seenR=G.rank.r;store.meta.seenB=Object.keys(G.earned);store.meta.seenStory=G.story.map(x=>x.id);store.meta.introDate=t0;store.meta.lastOpen=t0;store.meta.read=['pro'];
   save();awk.step=PROLOGUE.length+3;$('#view').innerHTML=viewAwaken();scrollTo(0,0);SFX.level();break}
  case 'awkdone':tab='quests';render();scrollTo(0,0);
   if(store.meta.migrated)popup({head:'SYNCHRONIZATION COMPLETE',icon:'check',sfx:'level',html:`<p>${store.meta.migrated} past training records were converted into EXP and stats.</p><p style="text-align:center;font-size:20px;font-weight:800">LEVEL ${G.lv.L} · RANK ${G.rank.r}</p><p class="small muted">${Object.keys(G.earned).length} badges already earned.</p>`});
   const s1=G.story.find(x=>x.id==='w1i');if(s1)popup({head:'NEW ENEMY',icon:'sword',sfx:'msg',html:`<p class="tiny" style="letter-spacing:.2em;color:var(--glow)">${esc(s1.title.toUpperCase())}</p><div class="msg">${esc(fx(s1.text))}</div>`,btn:'Begin'});
   break;
  case 'start':if(d){toast('Finish or abandon the current quest first.');return}startSession(b.dataset.t);break;
  case 'done':{const st=d.entries[i].sets[s];if(!st.done&&!(num(st.r)>0)){toast('Enter reps first');const inp=document.querySelector(`input[data-f="r"][data-i="${i}"][data-s="${s}"]`);inp&&inp.focus();return}
   st.done=!st.done;if(st.done){const nx=d.entries[i].sets[s+1];if(nx&&(nx.w===''||nx.w==null))nx.w=st.w;if(store.settings.autoTimer)startTimer(d.entries[i].rest);buzz(30)}save();render();break}
  case 'addset':{const e=d.entries[i],l=e.sets[e.sets.length-1];e.sets.push({w:l?l.w:'',r:'',done:false});save();render();break}
  case 'rmset':d.entries[i].sets.pop();save();render();break;
  case 'exmenu':{const e=d.entries[i];openSheet(`<h2>${EX[e.exId].en}</h2><div class="stack"><button data-act="swap" data-i="${i}">⇄ Swap for another machine</button>${i>0?`<button data-act="mv" data-i="${i}" data-dir="-1">↑ Move up</button>`:''}${i<d.entries.length-1?`<button data-act="mv" data-i="${i}" data-dir="1">↓ Move down</button>`:''}</div><h3>Rest time</h3><div class="row">${[45,60,90,120,180].map(r=>`<button data-act="rest" data-i="${i}" data-r="${r}" class="${e.rest===r?'pri':''}">${r}s</button>`).join('')}</div><div class="stack" style="margin-top:12px"><button class="dan" data-act="rmex" data-i="${i}">Remove exercise</button><button data-act="closesheet">Close</button></div>`);break}
  case 'swap':closeSheet();openPicker('swap',i);break;
  case 'mv':{const j=i+(+b.dataset.dir);[d.entries[i],d.entries[j]]=[d.entries[j],d.entries[i]];save();closeSheet();render();break}
  case 'rest':d.entries[i].rest=+b.dataset.r;save();closeSheet();render();break;
  case 'rmex':d.entries.splice(i,1);save();closeSheet();render();break;
  case 'addex':openPicker('add');break;
  case 'pick':{const id=b.dataset.id,ex=EX[id];if(pick.mode==='swap'){const old=d.entries[pick.i],same=EX[old.exId].k===ex.k;d.entries[pick.i]=makeEntry(id,old.sets.length,same?old.range.join('–'):DEFRANGE[ex.k],old.rest)}else d.entries.push(makeEntry(id,3,DEFRANGE[ex.k],90));save();closeSheet();render();break}
  case 'addcardio':d.cardio=d.cardio||[];d.cardio.push({m:CARDIO[0],min:''});save();render();break;
  case 'rmcardio':d.cardio.splice(+b.dataset.k,1);save();render();break;
  case 'finish':finishSession();break;
  case 'discard':confirmSheet('Abandon this quest? Nothing from it will be saved.','Abandon',()=>{store.draft=null;save();stopTimer();render()},true);break;
  case 'closesheet':closeSheet();break;
  case 'confirmok':{const fn=pendingConfirm;closeSheet();fn&&fn();break}
  case 'delsession':confirmSheet('Delete this session permanently? Stats and EXP will be recalculated.','Delete',()=>{store.sessions=store.sessions.filter(x=>x.id!==b.dataset.id);commit()},true);break;
  case 'tminus':timer.end=Math.max(Date.now(),timer.end-15000);tick();break;
  case 'tplus':timer.end=Math.max(timer.end,Date.now())+15000;timer.total+=15;timer.fin=false;$('#timer').classList.remove('fin');$('#tl').textContent='Rest';tick();break;
  case 'tskip':stopTimer();break;
  case 'rec':{const x=dayRec(t);x.rec=x.rec||{};x.rec[b.dataset.k]=!x.rec[b.dataset.k];commit(b.dataset.k==='move'&&x.rec.move?'Recovery Protocol':'');break}
  case 'creatine':{const x=dayRec(t);x.creatine=!x.creatine;commit();break}
  case 'vitamins':{const x=dayRec(t);x.vitamins=!x.vitamins;commit();break}
  case 'prot':{const x=dayRec(t);x.protein=x.protein||{g:0,done:false};x.protein.g=Math.max(0,num(x.protein.g)+(+b.dataset.g));commit();break}
  case 'protdone':{const x=dayRec(t);x.protein=x.protein||{g:0,done:false};x.protein.done=!x.protein.done;commit();break}
  case 'vtoggle':{const v=store.vt;if(v.start){v.acc=(v.acc||0)+Date.now()-v.start;v.start=null}else v.start=Date.now();save();render();break}
  case 'vlog':{const m=Math.round(vtMs()/60000);if(m<1){toast('Run the timer for at least a minute, or use +5 min.');return}const x=dayRec(t);x.vocal=x.vocal||{min:0};const before=num(x.vocal.min);x.vocal.min=before+m;store.vt={start:null,acc:0};commit(before<store.settings.vocalTarget&&x.vocal.min>=store.settings.vocalTarget?'Vocal Training complete':'');break}
  case 'vadd':{const x=dayRec(t);x.vocal=x.vocal||{min:0};const before=num(x.vocal.min);x.vocal.min=Math.max(0,before+(+b.dataset.m));commit(before<store.settings.vocalTarget&&x.vocal.min>=store.settings.vocalTarget?'Vocal Training complete':'');break}
  case 'cardio':{const m=num($('#cmin').value);if(!(m>0)){toast('Enter minutes');return}const x=dayRec(t);x.cardio=x.cardio||[];x.cardio.push({m:$('#cm').value,min:m});commit(m>=20?'Cardio complete':'');break}
  case 'rmcardio2':{const x=dayRec(t);x.cardio.splice(+b.dataset.k,1);commit();break}
  case 'bwsave':{let v=num($('#bwin').value);if(store.settings.bwUnit==='lb')v*=LB;if(!(v>25&&v<300)){toast('Enter a valid weight');return}const bfe=$('#bfin'),bf=bfe?num(bfe.value):0;if(bfe&&bfe.value.trim()&&!(bf>=3&&bf<=60)){toast('Body fat should be between 3 and 60%');return}const e={date:t,kg:r2(v)};if(bf>0)e.bf=Math.round(bf*10)/10;store.bw=store.bw.filter(x=>x.date!==t);store.bw.push(e);bwEditing=false;commit();break}
  case 'bwedit':{bwEditing=true;render();break}
  case 'trial':trialSheet();break;
  case 'trialsave':{const tr={date:t,pushups:num($('#tpush').value),plank:num($('#tplank').value),squats:num($('#tsquat').value),kg:r2(G.bodyKg)};closeSheet();store.trials=store.trials.filter(x=>x.date!==t);store.trials.push(tr);commit('Trial of Limits');break}
  case 'daymenu':dayMenu();break;
  case 'settype':{const x=dayRec(t);if(b.dataset.k)x.type=b.dataset.k;else delete x.type;closeSheet();commit();break}
  case 'pause':{const x=dayRec(t);x.pause=!x.pause;closeSheet();commit();break}
  case 'statinfo':statInfo(b.dataset.k);break;
  case 'chartdays':chartDays=+b.dataset.n;render();break;
  case 'chartstat':{const k=b.dataset.k;chartStats=chartStats.includes(k)?chartStats.filter(x=>x!==k):chartStats.concat(k);if(!chartStats.length)chartStats=[k];render();break}
  case 'balmode':balMode=+b.dataset.m;render();break;
  case 'vday':store.settings.vocalDays[i]=!store.settings.vocalDays[i];commit();break;
  case 'export':if(downloadFile(`system-veil-backup-${t}.json`,backupText(),'application/json'))markBackup();break;
  case 'share':try{await navigator.share({files:[new File([backupText()],`system-veil-backup-${t}.json`,{type:'application/json'})],title:'System Veil backup'});markBackup();toast('Backup saved ✓')}catch(e){if(e&&e.name!=='AbortError')toast('Sharing failed. Try Download or Copy.')}break;
  case 'copy':try{await navigator.clipboard.writeText(backupText());markBackup();toast('Backup copied. Paste it somewhere safe.')}catch(e){openSheet(`<h2>Copy this text</h2><textarea readonly style="min-height:200px">${esc(backupText())}</textarea><button data-act="closesheet" style="width:100%;margin-top:8px">Done</button>`);markBackup()}break;
  case 'csv':exportCSV();break;
  case 'importpaste':handleImport($('#pastein').value);break;
  case 'replay':popup({head:'PROLOGUE',icon:'book',html:`<div class="msg">${esc(PROLOGUE.join('\n\n'))}</div>`,btn:'Close'});break;
  case 'reset':confirmSheet('Erase ALL data on this device: workouts, quests, stats, story? This cannot be undone without a backup.','Erase everything',()=>{store=fresh();save();G=null;awk={step:0,f:{}};stopTimer();render()},true);break;
 }

document.addEventListener('input',ev=>{const t=ev.target,d=store.draft;
 if(t.dataset.f&&d){d.entries[+t.dataset.i].sets[+t.dataset.s][t.dataset.f]=t.value.replace(',','.');saveSoon();return}
 if(t.dataset.cf&&d){d.cardio[+t.dataset.k][t.dataset.cf]=t.value;saveSoon();return}
 if(t.id==='pickq'){const q=t.value.toLowerCase().trim();document.querySelectorAll('.pickitem').forEach(b=>b.style.display=!q||b.dataset.q.includes(q)?'':'none')}});
document.addEventListener('change',ev=>{const t=ev.target;
 if(t.dataset.cf&&store.draft){store.draft.cardio[+t.dataset.k][t.dataset.cf]=t.value;save();return}
 if(t.dataset.draft==='date'&&store.draft){if(t.value){store.draft.date=t.value;save();render()}return}
 if(t.id==='histex'){histEx=t.value;render();return}
 if(t.dataset.sched!=null){store.settings.schedule[+t.dataset.sched]=t.value;commit();return}
 if(t.dataset.prof){const k=t.dataset.prof;store.profile[k]=k==='name'?(t.value.trim()||store.profile.name):num(t.value)||store.profile[k];commit();return}
 if(t.dataset.set){const k=t.dataset.set;
  if(k==='title'){store.profile.title=t.value;save();render();return}
  if(t.type==='checkbox'){store.settings[k]=t.checked;if(t.checked&&(k==='stretch'||k==='skin'||k==='vitamins')){store.settings.qSince=store.settings.qSince||{};if(!store.settings.qSince[k]||store.settings.qSince[k]>todayStr())store.settings.qSince[k]=todayStr()}}else if(k==='startDate'){if(t.value)store.startDate=t.value}else if(k==='vocalTarget')store.settings[k]=+t.value;else if(k==='bfGoal'){const g=num(t.value);store.settings.bfGoal=g>0?Math.max(bfFloor(),Math.min(30,g)):null}else store.settings[k]=t.value;commit();return}
 if(t.id==='importfile'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>handleImport(String(r.result));r.readAsText(t.files[0]);t.value=''}});

function compPH(c){return `<svg viewBox="0 0 120 160" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="pg_${c.id}" cx="50%" cy="36%" r="75%"><stop offset="0" stop-color="${c.col}" stop-opacity=".6"/><stop offset="1" stop-color="#04070d"/></radialGradient></defs><rect width="120" height="160" fill="url(#pg_${c.id})"/>${[20,40,60,80,100].map(x=>`<line x1="${x}" y1="0" x2="${x}" y2="160" stroke="${c.col}" stroke-opacity=".08"/>`).join('')}<circle cx="60" cy="64" r="19" fill="rgba(2,8,16,.8)" stroke="${c.col}" stroke-width="1.5"/><path d="M20 162C20 120 38 98 60 98s40 22 40 64z" fill="rgba(2,8,16,.8)" stroke="${c.col}" stroke-width="1.5"/><text x="60" y="70" text-anchor="middle" font-size="16" font-weight="800" fill="${c.col}" font-family="-apple-system,sans-serif">${c.n[0]}</text></svg>`}
const art=(file,ph)=>`<div class="art">${ph}<img src="assets/${file}.webp" alt="" loading="lazy" onerror="this.remove()"></div>`;
function itemTile(it){const m=itemMeta(it);return `<svg viewBox="0 0 120 160" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="it_${it.k}_${it.id||it.v}" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="${m.col}" stop-opacity=".5"/><stop offset="1" stop-color="#04070d"/></radialGradient></defs><rect width="120" height="160" fill="url(#it_${it.k}_${it.id||it.v})"/><g transform="translate(36 42) scale(2)" stroke="${m.col}" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${IC[m.ic]}</g></svg>`}
function itemFile(it){return it.k==='gift'?'item_'+it.id:'item_'+({shards:'shards',ticket:'ticket',theme:'theme',frame:'frame',title:'title',lore:'lore'}[it.k]||'shards')}
function itemMeta(it){
 if(it.k==='comp'){const c=compById(it.id);return {n:c.n,sub:c.t,col:c.col,ic:'users'}}
 if(it.k==='gift')return {n:GIFTS[it.id].n,sub:`Bond gift · +${GIFTS[it.id].xp} bond`,col:RCOL[GIFTS[it.id].r],ic:'gift'};
 if(it.k==='theme')return {n:THEMES[it.id].n,sub:'Interface theme',col:THEMES[it.id].c,ic:'palette'};
 if(it.k==='frame')return {n:FRAMES[it.id].n,sub:'Status card frame',col:RCOL[FRAMES[it.id].r],ic:'frame'};
 if(it.k==='title')return {n:'“'+it.id+'”',sub:'Title',col:RCOL.SR,ic:'tag'};
 if(it.k==='lore')return {n:'Lore Fragment #'+(it.id+1),sub:'Data fragment',col:'#7fd8ff',ic:'scroll'};
 if(it.k==='shards')return {n:`${it.v} Shards`,sub:'Signal Shards',col:'#7fe8ff',ic:'gem'};
 if(it.k==='ticket')return {n:`${it.v} Ticket${it.v>1?'s':''}`,sub:'Recruit ticket',col:'#ffcc4d',ic:'ticket'};
 return {n:'?',sub:'',col:'#888',ic:'spark'};
}

function inv(){
 const E=G.econ,I={shards:E.shards,tickets:E.tickets,gifts:{...E.gifts},themes:new Set(['ion',...E.themes]),frames:new Set(['basic']),titles:new Set(E.titles),lore:new Set(),comps:{}};
 for(const [id,o] of Object.entries(G.owned))I.comps[id]=o;
 const add=it=>{if(it.k==='shards')I.shards+=it.v;else if(it.k==='ticket')I.tickets+=it.v;else if(it.k==='gift')I.gifts[it.id]=(I.gifts[it.id]||0)+1;else if(it.k==='theme')I.themes.add(it.id);else if(it.k==='frame')I.frames.add(it.id);else if(it.k==='title')I.titles.add(it.id);else if(it.k==='lore')I.lore.add(it.id)};
 for(const p of store.pulls){if(p.pay==='tk')I.tickets-=p.cost;else I.shards-=p.cost;p.res.forEach(add)}
 for(const l of store.loot)add(l.item);
 for(const u of store.giftUse)I.gifts[u.g]=(I.gifts[u.g]||0)-1;
 return I;
}

const rpick=a=>a[Math.floor(Math.random()*a.length)];
function rollItem(rar,I,taken){
 const free=(cat,pool)=>Object.keys(pool).filter(k=>pool[k].r===rar&&!pool[k].season&&!I[cat].has(k)&&!taken.has(cat+k));
 if(rar==='R'){const x=Math.random();if(x<.45)return {k:'shards',v:20,r:'R'};if(x<.8)return {k:'gift',id:'g1',r:'R'};const l=LORE.map((_,i)=>i).filter(i=>!I.lore.has(i)&&!taken.has('lore'+i));if(l.length){const id=l[0];taken.add('lore'+id);return {k:'lore',id,r:'R'}}return {k:'shards',v:25,r:'R'}}
 const x=Math.random();
 if(rar==='SR'){if(x<.4)return {k:'gift',id:'g2',r:'SR'};if(x<.8){const opts=[...free('themes',THEMES).map(id=>({k:'theme',id})),...free('frames',FRAMES).map(id=>({k:'frame',id})),...GTITLES.filter(t=>!I.titles.has(t)&&!taken.has('titles'+t)).map(id=>({k:'title',id}))];if(opts.length){const o=rpick(opts);taken.add((o.k==='theme'?'themes':o.k==='frame'?'frames':'titles')+o.id);return {...o,r:'SR'}}}return {k:'shards',v:60,r:'SR'}}
 const opts=[...free('themes',THEMES).map(id=>({k:'theme',id})),...free('frames',FRAMES).map(id=>({k:'frame',id}))];
 if(x<.5&&opts.length){const o=rpick(opts);taken.add((o.k==='theme'?'themes':'frames')+o.id);return {...o,r:'SSR'}}
 return {k:'gift',id:'g3',r:'SSR'};
}
function pityCount(){let n=0;for(const p of store.pulls)for(const it of p.res){n++;if(it.k==='comp'&&it.r==='SSR')n=0}return n}
function doPull(n){
 const I=inv();let pay,cost;if(I.tickets>=n){pay='tk';cost=n}else{pay='sh';cost=n===10?900:100;if(I.shards<cost){toast('Not enough Signal Shards or tickets.');return}}
 const firstTen=n===10&&!store.pulls.some(p=>p.n===10);let pity=pityCount();const taken=new Set(),res=[],owned={...I.comps};
 for(let i=0;i<n;i++){pity++;const x=Math.random();let it;
  if(pity>=60||x<.02){it={k:'comp',id:rpick(COMP.filter(c=>c.r==='SSR'&&!c.story)).id,r:'SSR'};pity=0}
  else if(x<.10)it={k:'comp',id:rpick(COMP.filter(c=>c.r==='SR')).id,r:'SR'};
  else if(x<.13)it=rollItem('SSR',I,taken);else if(x<.30)it=rollItem('SR',I,taken);else it=rollItem('R',I,taken);
  res.push(it)}
 if(n===10&&!res.some(r=>r.r!=='R'))res[9]={k:'comp',id:rpick(COMP.filter(c=>c.r==='SR')).id,r:'SR'};
 if(firstTen&&!res.some(r=>r.k==='comp'))res[9]={k:'comp',id:rpick(COMP.filter(c=>c.r==='SR')).id,r:'SR'};
 res.forEach(it=>{if(it.k!=='comp')return;if(owned[it.id]){it.dup=true;owned[it.id].stars=(owned[it.id].stars||0)+1;if(owned[it.id].stars>5){it.k='gift';it.id='g3';it.r='SSR';delete it.dup}}else{owned[it.id]={stars:0};it.isNew=true}});
 store.pulls.push({ts:Date.now(),date:todayStr(),n,pay,cost,res:res.map(r=>{const o={...r};delete o.isNew;return o})});
 save();const b=G;recompute();gachaShow(res,()=>{notifyDiff(b,G);res.filter(r=>r.isNew).forEach(r=>{const c=compById(r.id);popup({head:'NEW COMPANION',icon:'users',sfx:'badge',burst:true,html:`<div style="max-width:220px;margin:0 auto">${cardHTML({k:'comp',id:c.id,r:c.r},{})}</div><p style="text-align:center;font-weight:800;font-size:18px;margin:10px 0 0">${esc(c.n)}</p><p class="tiny muted" style="text-align:center">${esc(c.t)} · bond grows from: ${esc(c.d)}</p><div class="veil"><div>${esc(fx(c.id==='veil'?COMP_LINES.veil.greet[0]:COMP_LINES[c.id].greet[0]))}</div></div>`})});render()});
}

 /* neck + head */
 const top=side?f.t.s:[(f.t.sL[0]+f.t.sR[0])/2,(f.t.sL[1]+f.t.sR[1])/2];
 g+=`<g class="lb${H('neck')?' hot':''}">${mqSeg(top,f.neck,9,'o')}${mqSeg(top,f.neck,6,'f')}</g>`;

function warpRun(cv,dur,getCol){
 const x=cv.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1),W=cv.width=innerWidth*dpr,H=cv.height=innerHeight*dpr,cx=W/2,cy=H*.45,M=Math.max(W,H);

  for(const s of S){const r0=s.r;s.r+=sp*s.z*(1+s.r/(W*.12));const ca=Math.cos(s.a),sa=Math.sin(s.a);x.strokeStyle=s.c?col:`rgba(225,240,255,${.35+s.z*.6})`;x.lineWidth=(.6+s.z*1.6)*dpr;x.beginPath();x.moveTo(cx+ca*r0,cy+sa*r0);x.lineTo(cx+ca*s.r,cy+sa*s.r);x.stroke();if(s.r>M)Object.assign(s,mk(false))}
  raf=requestAnimationFrame(f)};
 raf=requestAnimationFrame(f);return ()=>cancelAnimationFrame(raf)}

 m:[['Essential',2,5,'#ff6b6b'],['Athletic',6,13,'#3dffa8'],['Fitness',14,17,'#4fd6ff'],['Average',18,24,'#ffcf5a'],['High',25,60,'#ff8a5c']],
 f:[['Essential',10,13,'#ff6b6b'],['Athletic',14,20,'#3dffa8'],['Fitness',21,24,'#4fd6ff'],['Average',25,31,'#ffcf5a'],['High',32,60,'#ff8a5c']]};
const bfSex=()=>store.settings.bfSex==='f'?'f':'m';
const bfFloor=()=>bfSex()==='f'?17:10;
const bfGoal=()=>{const g=num(store.settings.bfGoal);return g>0?Math.max(bfFloor(),g):(bfSex()==='f'?20:13)};
const bfCat=v=>{const c=BF_CATS[bfSex()];for(const x of c)if(v<x[2]+1)return x;return c[c.length-1]};
const bfEntries=()=>store.bw.filter(x=>x.bf>0).sort((a,b)=>a.date.localeCompare(b.date));
function bfAvgAt(list,dn){const r=list.filter(x=>{const k=dayNum(x.date);return k<=dn&&k>dn-7});return r.length?r.reduce((a,x)=>a+x.bf,0)/r.length:null}
function slopePerWeek(pts){if(pts.length<4)return null;const n=pts.length,mx=pts.reduce((a,p)=>a+p[0],0)/n,my=pts.reduce((a,p)=>a+p[1],0)/n;let sxy=0,sxx=0;for(const [x,y] of pts){sxy+=(x-mx)*(y-my);sxx+=(x-mx)**2}return sxx?sxy/sxx*7:null}
function bfStats(){const L=bfEntries();if(!L.length)return null;const tN=dayNum(todayStr());
 const now=bfAvgAt(L,tN)??L[L.length-1].bf,first=L.slice(0,Math.min(7,L.length)),start=first.reduce((a,x)=>a+x.bf,0)/first.length;
 const rec=L.filter(x=>dayNum(x.date)>tN-28).map(x=>[dayNum(x.date),x.bf]),bfSlope=slopePerWeek(rec);
 const kg=store.bw.filter(x=>dayNum(x.date)>tN-28).map(x=>[dayNum(x.date),x.kg]),kgSlope=slopePerWeek(kg),kgNow=kg.length?kg[kg.length-1][1]:null;
 return {L,now,start,bfSlope,kgPct:kgSlope!=null&&kgNow?kgSlope/kgNow*100:null,n7:L.filter(x=>dayNum(x.date)>tN-7).length}}
function bfAdvice(s){const g=bfGoal();
 if(s.now<bfFloor())return `<p class="small lo">${ic('warn',13)} Below the recommended floor (${bfFloor()}%). Don't cut further. Eat to maintain and keep training.</p>`;
 if(s.kgPct!=null&&s.kgPct<-1)return `<p class="small lo">${ic('warn',13)} Weight is dropping ~${Math.abs(s.kgPct).toFixed(1)}% a week. Faster than ~1% a week costs muscle, so eat a little more.</p>`;
 if(s.now<=g)return `<p class="small ok">In the zone. Hold here: eat at maintenance and keep training.</p>`;
 return `<p class="tiny muted">A healthy pace is about 0.5–1% of bodyweight a week, with protein at your target and lifting kept up.</p>`}
function bfChart(L){const W=340,H=190,Lm=30,Rm=58,T=10,Bm=22,g=bfGoal(),cats=BF_CATS[bfSex()];
 const pts=L.slice(-90),labels=pts.map(x=>x.date),avg=pts.map(x=>bfAvgAt(L,dayNum(x.date))),vals=pts.map(x=>x.bf);
 let mn=Math.floor(Math.min(g-2,...vals)-1),mx=Math.ceil(Math.max(g+4,...vals)+1);const n=Math.max(2,pts.length);
 const X=i=>Lm+(pts.length<2?.5:i/(n-1))*(W-Lm-Rm),Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-Bm);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
 for(const [nm,lo,hi,col] of cats){const a=Math.max(lo-.5,mn),b=Math.min(hi+.5,mx);if(b<=a)continue;s+=`<rect x="${Lm}" y="${Y(b).toFixed(1)}" width="${W-Lm-Rm}" height="${(Y(a)-Y(b)).toFixed(1)}" fill="${col}" opacity=".07"/><text x="${W-Rm+5}" y="${((Y(a)+Y(b))/2+3).toFixed(1)}" font-size="9" fill="${col}" opacity=".85">${nm}</text>`}
 for(let j=0;j<=4;j++){const v=mn+(mx-mn)*j/4,y=Y(v);s+=`<line x1="${Lm}" x2="${W-Rm}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(79,214,255,.10)"/><text x="${Lm-5}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="#7d98b3">${Math.round(v)}%</text>`}
 s+=`<line x1="${Lm}" x2="${W-Rm}" y1="${Y(g).toFixed(1)}" y2="${Y(g).toFixed(1)}" stroke="#ffd27f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-Rm-3}" y="${(Y(g)-4).toFixed(1)}" text-anchor="end" font-size="9.5" font-weight="700" fill="#ffd27f">GOAL ${g}%</text>`;
 if(pts.length>1)[0,Math.floor((pts.length-1)/2),pts.length-1].forEach((i,k)=>{s+=`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="${k===0?'start':k===2?'end':'middle'}" font-size="9.5" fill="#7d98b3">${labels[i].slice(5)}</text>`});
 pts.forEach((x,i)=>{s+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(x.bf).toFixed(1)}" r="2.2" fill="#b48cff" opacity=".45"/>`});
 let d='';avg.forEach((v,i)=>{if(v==null)return;d+=(d?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)});
 if(pts.length>1)s+=`<path d="${d}" fill="none" stroke="#4fd6ff" stroke-width="2.4" stroke-linejoin="round" style="filter:drop-shadow(0 0 4px #4fd6ff)"/>`;
 return s+'</svg>'}
function bfSection(){const s=bfStats(),g=bfGoal();
 let h=`<section class="win"><div class="wt">Body Fat</div>`;
 if(!s)return h+`<p class="small muted">Add your scale's body fat % to the daily Weigh-in (Quests tab → Bonus Quests). Your trend toward the fit zone appears here.</p></section>`;
 h+=`<div class="row" style="text-align:center;margin-bottom:6px"><div style="flex:1"><div class="tiny muted">7-DAY AVG</div><div style="font-size:24px;font-weight:800;color:${bfCat(s.now)[3]}">${s.now.toFixed(1)}%</div></div><div style="flex:1"><div class="tiny muted">GOAL</div><div style="font-size:24px;font-weight:800;color:#ffd27f">${g}%</div></div><div style="flex:1"><div class="tiny muted">TREND</div><div style="font-size:18px;font-weight:700;margin-top:4px">${s.bfSlope==null?'—':(s.bfSlope>0?'+':'')+s.bfSlope.toFixed(2)+'<span class="tiny"> /wk</span>'}</div></div></div>`;
 h+=bfChart(s.L)+`<p class="tiny muted"><span style="color:#4fd6ff">━</span> 7-day average · <span style="color:#b48cff">●</span> daily reading · <span style="color:#ffd27f">┅</span> your goal</p>`;
 h+=bfAdvice(s)+`<details class="cue"><summary>Why the 7-day average?</summary><p class="small">Bathroom scales estimate body fat with a small electrical current (bioelectrical impedance). Water, food and exercise can swing a single reading by 1–3 points, so the average is the number that matters. Weigh at the same time each day: after waking, after the bathroom, before eating or drinking.</p></details></section>`;
 return h}
function bfCard(){const s=bfStats(),g=bfGoal();if(!s)return `<section class="win"><div class="wt">Body Composition</div><p class="small muted">Log your body fat % in the daily Weigh-in to track your progress toward the fit zone.</p></section>`;
 const cat=bfCat(s.now),span=Math.max(.1,s.start-g),pct=s.now<=g?100:Math.max(0,Math.min(100,(s.start-s.now)/span*100));
 return `<section class="win"><div class="wt">Body Composition</div><div class="row" style="align-items:flex-end"><div style="flex:1"><div style="font-size:34px;font-weight:800;line-height:1;color:${cat[3]};text-shadow:0 0 12px ${cat[3]}">${s.now.toFixed(1)}<span style="font-size:16px">%</span></div><div class="tiny" style="letter-spacing:.25em;color:${cat[3]};margin-top:4px">${cat[0].toUpperCase()} · ACE</div></div><div style="text-align:right"><div class="tiny muted">FIT GOAL</div><div style="font-size:20px;font-weight:800;color:#ffd27f">${g}%</div><div class="tiny muted">${s.now<=g?'reached ✓':(s.now-g).toFixed(1)+' pts to go'}</div></div></div>
 <div class="barlab" style="margin-top:10px"><span>PROGRESS FROM ${s.start.toFixed(1)}%</span><span class="mono">${Math.round(pct)}%</span></div><div class="bar"><i style="width:${pct}%;background:linear-gradient(90deg,#b48cff,#ffd27f)"></i></div>${bfAdvice(s)}</section>`}
function bfSettings(){const sx=bfSex(),g=bfGoal(),c=BF_CATS[sx];

function swapsFor(x,self){const P=planIds();return Object.entries(EX).filter(([id,y])=>id!==self&&P.has(id)&&y.mv&&y.mv===x.mv).map(([,y])=>y.en)}
function pickBtn(id,x,note){return `<button class="pickitem" data-act="pick" data-id="${id}" data-q="${esc((x.en+' '+x.ja+' '+(MV_NAME[x.mv]||'')+' '+x.p.concat(x.s).map(m=>MUSCLES[m].n+' '+MUSCLES[m].ja).join(' ')).toLowerCase())}"><b>${x.en}</b> <span class="muted small">${x.ja}</span>${x.lib?'':' <span class="chip" style="--c:#4fd6ff">Your gym</span>'}<div class="chips" style="margin:4px 0 0">${chipsEx(x)}</div>${note?`<div class="tiny muted" style="margin-top:4px">${note}</div>`:''}</button>`}
function openPicker(mode,i){pick={mode,i};
 const d=store.draft,cur=mode==='swap'&&d&&d.entries[i]?d.entries[i].exId:null,cx=cur?EX[cur]:null;let h='';
 if(cx){const same=Object.entries(EX).filter(([id,y])=>id!==cur&&y.mv&&y.mv===cx.mv).sort((a,b)=>(a[1].lib||0)-(b[1].lib||0));
  const near=Object.entries(EX).filter(([id,y])=>id!==cur&&y.mv!==cx.mv&&y.p[0]===cx.p[0]).slice(0,8);
  h+=`<h3 style="color:var(--glow2)">⇄ Suggested swaps for ${esc(cx.en)}</h3><p class="tiny muted" style="margin-top:-4px">Same movement (${esc(MV_NAME[cx.mv]||'similar')}): trains the same thing, so your plan stays balanced.</p>`+(same.length?same.map(([id,y])=>pickBtn(id,y)).join(''):'<p class="tiny muted">No direct match. Try the list below.</p>');
  if(near.length)h+=`<h3>Also trains ${esc(MUSCLES[cx.p[0]].n)}</h3>`+near.map(([id,y])=>pickBtn(id,y,MV_NAME[y.mv]||'')).join('')}
 h+=`<details class="cue" ${cx?'':'open'}><summary>Your gym's machines</summary>`+Object.keys(AREAS).map(a=>`<h3>${AREAS[a]}</h3>`+Object.entries(EX).filter(([,x])=>x.a===a).map(([id,x])=>pickBtn(id,x)).join('')).join('')+`</details>`;
 const used=new Set();h+=`<h3 style="margin-top:16px">Exercise library</h3><p class="tiny muted" style="margin-top:-4px">Common machines, free weights, cables and bodyweight moves found in most gyms. Each one shows which plan exercises it can replace.</p>`;
 for(const [n,f] of LIBCAT){const items=Object.entries(EX).filter(([id,x])=>x.lib&&!used.has(id)&&f(x));if(!items.length)continue;items.forEach(([id])=>used.add(id));

 popup({head:'DAILY QUESTS HAVE ARRIVED',icon:'quest',sfx:'msg',html:`<p class="tiny muted" style="letter-spacing:.2em">${fmtDate(t).toUpperCase()} · ${TYPE_LABEL[R.type].toUpperCase()}</p>${R.req.map(k=>`<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">${ic({main:R.type==='rest'?'moon':'str',vocal:'mic',creatine:'flask',vitamins:'pill',protein:'shaker',stretch:'stretch',skin:'drop'}[k],16)} ${esc(names[k])}</div>`).join('')}<p class="small" style="margin-top:10px">Reward: <b>+60 EXP</b>, streak, HP. <span class="muted">Missing them costs HP.</span></p><p class="small" style="color:#ff9fb0">${ic('sword',14)} ${esc(bossName(G.cw))}: ${Math.round(Math.max(0,b.max-b.dmg)/b.max*100)}% HP left</p>`,btn:'Accept'});
 save();
}
function checkRollover(){if(!store.profile||!G)return;if(G.today!==todayStr()){const b=G;recompute();notifyDiff(b,G);dailyIntro();render()}}
setInterval(checkRollover,60000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').then(()=>{try{caches.open('leanbuild-v1').then(c=>c.add(location.href.split('#')[0])).catch(()=>{})}catch(e){}}).catch(()=>{})}
(function boot(){
 if(store.profile){recompute();const b=null;notifyDiff(b,G);dailyIntro()}
 precacheArt();
 render();runTyped();
})();
</script>
</body>
